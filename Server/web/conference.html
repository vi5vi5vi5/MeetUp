      // функций со старым состоянием — берём их через ref.
      M.keys = { toggleMic, toggleCamera, toggleSound, toggleTheater };
    });

    // Демонстрация кончилась (или ведущий сменился на нас) — полноэкранный
    // показ терять смысл: показывать нечего.
    useEffect(() => {
      if (theater && !(screenActive && !screenSelf)) setTheater(false);
    }, [screenActive, screenSelf, theater]);

    // Из полного экрана можно выйти и мимо нашей кнопки — F11, Esc, жест на
    // телефоне. Тогда свой режим тоже надо снять, иначе шапка и док
    // остались бы спрятанными в обычном окне.
    useEffect(() => {
      const onFs = () => { if (!document.fullscreenElement) setTheater(false); };
      document.addEventListener("fullscreenchange", onFs);
      return () => document.removeEventListener("fullscreenchange", onFs);
    }, []);

    // Живые показатели — только пока открыт раздел «Диагностика»: считать
    // и перерисовывать их всё время конференции незачем.
    useEffect(() => {
      if (!settingsOpen || section !== "diag") return;
      setDiag(engine.metrics());
      const t = setInterval(() => setDiag(engine.metrics()), 1000);
      return () => clearInterval(t);
    }, [settingsOpen, section]);

    // Проба декодеров — один раз за сессию, при первом заходе в «О программе».
    useEffect(() => {
      if (!settingsOpen || section !== "about" || decodeOk) return;
      let alive = true;
      engine.decodeOk().then(list => { if (alive) setDecodeOk(list); });
      return () => { alive = false; };
    }, [settingsOpen, section, decodeOk]);

    // Индикатор уровня микрофона — обновляется только при открытых настройках.
    useEffect(() => {
      if (!settingsOpen) return;
      const t = setInterval(() => setMicLevel(engine.micLevel()), 100);
      return () => clearInterval(t);
    }, [settingsOpen]);

    // До трёх участников на широком экране — «дизайнерская» раскладка
    // (своя плитка крупнее); дальше — равномерная сетка страницами.
    const featured = !isMobile && tiles.length <= 3;
    let gridStyle;
    if (featured) {
      gridStyle = tiles.length === 1
        ? { gridTemplateColumns: "1fr", gridTemplateRows: "1fr" }
        : tiles.length === 2
          ? { gridTemplateColumns: "1fr 1fr", gridTemplateRows: "1fr" }
          : { gridTemplateColumns: "2fr 1fr", gridTemplateRows: "1fr 1fr" };
    } else {
      const k = Math.max(1, visible.length);
      const cols = isMobile ? (k <= 2 ? 1 : 2) : Math.ceil(Math.sqrt(k));
      const rows = Math.ceil(k / cols);
      gridStyle = {
        gridTemplateColumns: "repeat(" + cols + ", 1fr)",
        gridTemplateRows: "repeat(" + rows + ", 1fr)",
        overflow: "hidden",
      };
    }

    function renderTile(t, idx, film) {
      const locked = !t.self && lockedIds.has(t.id);
      // Камера закреплённого рисуется на сцене: у чужого потока один canvas
      // (второй перехватил бы кадры у сцены) — в плёнке остаётся аватарка.
      const onStage = pinActive && !t.self && t.id === pinnedId;
      let media = null;
      if (t.self) {
        if (cam)
          media = <video ref={selfVideoRef} className={"tile-media" + (mirror ? " mirror" : "")}
                         autoPlay muted playsInline />;
      } else if (t.cam && t.hasFrame && !locked && !onStage) {
        media = <canvas className="tile-media" ref={engine.videoSinkRef(t.id)} />;
      }
      if (!media && t.avatar && !locked)
        media = <div className="tile-ava"><img src={t.avatar} alt="" /></div>;
      const spanSelf = !film && featured && tiles.length === 3 && idx === 0;
      const pinned = pinActive && t.id === pinnedId;
      return (
        <div key={t.key} className={film ? "film-cell" : undefined}
             onClick={() => tileClick(t)}
             onContextMenu={t.self ? undefined : (e) => openPeerVol(t, e)}
             onTouchStart={t.self ? undefined : () => holdStart(t)}
             onTouchEnd={holdCancel} onTouchMove={holdCancel} onTouchCancel={holdCancel}
             title={(pinned ? "Вернуть обычный вид" : "Развернуть на весь экран")
                    + (t.self ? "" : " · правая кнопка — громкость")}
             style={{ cursor: "pointer",
                      ...(pinned ? { outline: "2px solid var(--accent)", outlineOffset: -2,
                                     borderRadius: "var(--radius-lg)" } : null),
                      ...(film ? null : { minHeight: 0, ...(spanSelf ? { gridRow: "1 / 3" } : null) }) }}>
          <VideoTile name={t.name} self={t.self} muted={!t.mic} speaking={t.speaking}
                     style={{ aspectRatio: "auto", height: "100%" }}>
            {(media || locked) ? <>
              {media}
              {locked &&
                <div className="tile-lock">
                  <div><b>🔒</b>Зашифровано — нужен ключ</div>
                </div>}
            </> : null}
          </VideoTile>
        </div>
      );
    }

    // Что показывает сцена при закреплённом участнике.
    function stagePinMedia() {
      const t = pinnedTile;
      if (t.self) {
        if (cam)
          return <video ref={stagePinSelfRef} className={"stage-media" + (mirror ? " mirror" : "")}
                        autoPlay muted playsInline />;
      } else if (t.cam && t.hasFrame && !lockedIds.has(t.id)) {
        return <canvas key={"pin" + t.id} className="stage-media"
                       ref={engine.videoSinkRef(t.id)} />;
      }
      if (t.avatar) return <div className="tile-ava stage-ava"><img src={t.avatar} alt="" /></div>;
      return <div className="stage-wait">
        {!t.self && t.cam ? "Подключаем камеру…" : "Камера выключена"}
      </div>;
    }

    function onTouchStart(e) { touchX.current = e.touches[0].clientX; }
    function onTouchEnd(e) {
      if (touchX.current == null) return;
      const dx = e.changedTouches[0].clientX - touchX.current;
      touchX.current = null;
      if (Math.abs(dx) < 60) return;
      if (dx < 0) setPage(p => Math.min(pages - 1, p + 1));
      else setPage(p => Math.max(0, p - 1));
    }

    function tabStyle(k) {
      const on = tab === k;
      return {
        border: "1px solid " + (on ? "transparent" : "var(--border)"),
        background: on ? "var(--accent)" : "transparent",
        color: on ? "var(--on-accent)" : "var(--text-muted)",
      };
    }

    // Пинг: до 80 мс — отлично, до 200 — терпимо, дальше подсвечиваем бедой.
    function pingTone(ms) {
      return ms < 80 ? "accent" : ms < 200 ? "muted" : "danger";
    }

    // Содержимое пузыря сообщения: картинка (или её заглушка) + текст.
    function msgContent(m) {
      const img = m.image
        ? <img className="chat-img" src={m.image} alt="изображение"
               onClick={() => setLightbox(m.image)} />
        : m.imageLocked
          ? <span className="chat-img-stub">🔒 Изображение зашифровано — нужен ключ</span>
          : m.imageDropped
            ? <span className="chat-img-stub">Изображение больше недоступно</span>
            : null;
      if (!img) return m.text;
      return <>
        {img}
        {m.text ? <span style={{ display: "block", marginTop: 6 }}>{m.text}</span> : null}
      </>;
    }

    // ================= Настройки: разделы =================
    // Разделов восемь, как в десктопном клиенте, и порядок тот же — человек,
    // знакомый с одним, находит нужное во втором не глядя. Содержимое разное:
    // в браузере половина десктопных ручек — фикция (кодек выбирает
    // WebCodecs, разрешение демонстрации задаёт системное окно выбора,
    // глобальных клавиш нет вовсе). Заглушек «скоро» не ставим: если чего-то
    // в вебе быть не может, честнее объяснить почему.
    const curSection = SECTIONS.find(s => s.id === section) || SECTIONS[0];

    function closeSettings() {
      setSettingsOpen(false);
      setOnSection(false);
    }

    // Тумблер: подпись, пояснение и переключатель справа.
    function Toggle({ on, label, sub, onToggle }) {
      return (
        <button type="button" className={"set-toggle" + (on ? " on" : "")}
                role="switch" aria-checked={on} onClick={onToggle}>
          <span style={{ minWidth: 0 }}>
            {label}
            {sub && <span className="sub">{sub}</span>}
          </span>
          <span className="knob" />
        </button>
      );
    }

    const KV = ({ k, v }) => <div className="set-kv"><b>{k}</b><span>{v}</span></div>;

    // Отчёт для «скопировать»: то же, что видно в разделе, одним текстом —
    // его удобно приложить к жалобе «у меня всё тормозит».
    function diagReport() {
      const s = engine.stats();
      const m = diag || { rxKbps: 0, txKbps: 0, rxFps: 0, txFps: 0 };
      return [
        "MeetUp — диагностика",
        "Комната: " + (roomTitle || roomCode),
        "Сервер: " + location.host,
        "Задержка до сервера: " + (ping == null ? "—" : ping + " мс"),
        "Приём: " + m.rxKbps + " кбит/с, " + m.rxFps + " кадр/с",
        "Отправка: " + m.txKbps + " кбит/с, " + m.txFps + " кадр/с",
        "Очередь в сокете: " + Math.round(s.buffered / 1024) + " КБ",
        "Камера: " + s.camCodec + ", битрейт " + Math.round(s.camRate * 100) + "% от пресета",
        "Демонстрация: " + s.screenCodec + ", битрейт " + Math.round(s.screenRate * 100) + "%",
        "Звук: " + s.audioCodec,
        "Умеем кодировать: " + s.encodeOk.join(", "),
        "Шифрование: " + (s.encrypted ? "включено" : "выключено"),
        "Браузер: " + navigator.userAgent,
      ].join("\n");
    }

    function renderSection() {
      switch (section) {

      case "audio": return <>
        <Field label="Микрофон" htmlFor="set-mic">
          <select id="set-mic" className="set-select" value={micId}
                  onChange={e => selectMic(e.target.value)}>
            {!devices.mics.some(d => d.id === micId) &&
              <option value={micId}>Системный по умолчанию</option>}
            {devices.mics.map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
          </select>
          <div className="mic-meter" aria-hidden="true">
            <div className="mic-meter-fill"
                 style={{ width: Math.round(Math.min(1, micLevel * 3) * 100) + "%" }} />
          </div>
        </Field>

        <Field label="Динамики" htmlFor="set-out"
               hint={sinkSupported ? undefined : "Этот браузер не даёт выбрать устройство вывода — звук идёт в системное по умолчанию."}>
          <select id="set-out" className="set-select" value={outId} disabled={!sinkSupported}
                  onChange={e => selectOut(e.target.value)}>
            {!devices.outs.some(d => d.id === outId) &&
              <option value={outId}>Системные по умолчанию</option>}
            {devices.outs.map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
          </select>
        </Field>

        <Field label={"Громкость воспроизведения · " + volume + "%"} htmlFor="set-volume">
          <input id="set-volume" className="set-range" type="range"
                 min="0" max="200" step="5" value={volume}
                 style={{ background: rangeFill(volume, 200) }}
                 onChange={e => changeVolume(Number(e.target.value))} />
        </Field>

        <Field label={"Чувствительность микрофона · " + sens + "%"} htmlFor="set-sens"
               hint="Влияет на громкость вашего голоса у собеседников.">
          <input id="set-sens" className="set-range" type="range"
                 min="0" max="200" step="5" value={sens}
                 style={{ background: rangeFill(sens, 200) }}
                 onChange={e => changeSens(Number(e.target.value))} />
        </Field>

        <Field label="Качество звука" htmlFor="set-qaudio"
               hint="Голос идёт кодеком Opus. Выше битрейт — заметнее оттенки голоса и музыка.">
          <select id="set-qaudio" className="set-select" value={quality.audio}
                  onChange={e => selectQuality("audio", e.target.value)}>
            {Q_LEVELS.map(l => <option key={l} value={l}>{Q_LABELS.audio[l]}</option>)}
          </select>
        </Field>

        <Field label="Обработка голоса"
               hint="Делает браузер, ещё до того как звук попадает к нам. Меняется на лету — микрофон не перезапускается.">
          <div style={{ display: "grid", gap: 8 }}>
            <Toggle on={proc.noise} label="Шумоподавление"
                    sub="Убирает вентилятор, клавиатуру и уличный шум"
                    onToggle={() => toggleProc("noise")} />
            <Toggle on={proc.echo} label="Эхоподавление"
                    sub="Нужно, когда вы слушаете через динамики, а не наушники"
                    onToggle={() => toggleProc("echo")} />
            <Toggle on={proc.agc} label="Автоусиление"
                    sub="Подтягивает тихий голос и придерживает громкий"
                    onToggle={() => toggleProc("agc")} />
          </div>
        </Field>
      </>;

      case "video": return <>
        <Field label="Камера" htmlFor="set-cam">
          <select id="set-cam" className="set-select" value={camId}
                  onChange={e => selectCam(e.target.value)}>
            {!devices.cams.some(d => d.id === camId) &&
              <option value={camId}>Системная по умолчанию</option>}
            {devices.cams.map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
          </select>
        </Field>

        <Field label="Качество отправки" htmlFor="set-qcam"
               hint="Выше качество — больше нагрузка на сеть. Применяется сразу: камера перезахватывается с новым разрешением.">
          <select id="set-qcam" className="set-select" value={quality.cam}
                  onChange={e => selectQuality("cam", e.target.value)}>
            {Q_LEVELS.map(l => <option key={l} value={l}>{Q_LABELS.cam[l]}</option>)}
          </select>
        </Field>

        <Field label="Отображение">
          <Toggle on={mirror} label="Зеркалить моё видео"
                  sub="Только у вас — собеседники видят вас как есть"
                  onToggle={() => { const v = !mirror; setMirror(v); setPref("mirror", v); }} />
        </Field>

        <p className="set-note">
          Кодек не выбирается: в браузере это решает WebCodecs. Мы отправляем
          H.264 — его понимают все, — а принимаем всё, что умеет ваш браузер.
          Если собеседник не сможет разобрать чужое видео, отправитель узнает
          об этом и перейдёт на H.264 сам.
        </p>
      </>;

      case "share": return <>
        <Field label="Качество демонстрации" htmlFor="set-qscreen"
               hint="«Эко» бережёт сеть и годится для слайдов, «Плавное» — для видео и анимации.">
          <select id="set-qscreen" className="set-select" value={quality.screen}
                  onChange={e => selectQuality("screen", e.target.value)}>
            {Q_LEVELS.map(l => <option key={l} value={l}>{Q_LABELS.screen[l]}</option>)}
          </select>
        </Field>

        <Field label="Что решает браузер">
          <div>
            <KV k="Демонстрация экрана" v={shareSupported ? "доступна" : "этот браузер не умеет"} />
            <KV k="Что показывать" v="Выбирается в системном окне при запуске" />
            <KV k="Со звуком" v="По галочке «Поделиться звуком» в том же окне" />
          </div>
        </Field>

        <p className="set-note">
          Разрешение, частоту кадров и показ курсора задаёт сам браузер по
          тому, что вы выбрали в окне доступа, — своих ручек для них здесь нет.
          Звук демонстрации отдают только Chrome и Edge, и галочка в их окне и
          есть согласие: второй тумблер здесь означал бы «вы разрешили, а мы
          всё равно не отправили».
        </p>
      </>;

      case "crypto": return <>
        <Field label={"Сквозное шифрование" + (e2eOn ? " · включено" : "")} htmlFor="set-e2e"
               hint="Одна фраза у всех участников. Ключ не покидает браузер — сервер видит только шифротекст.">
          <div style={{ display: "flex", gap: 8 }}>
            <Input id="set-e2e" type="password" value={e2ePhrase} autoComplete="off"
                   placeholder={e2eOn && !e2ePhrase ? "Ключ загружен из ссылки" : "Фраза-ключ"}
                   onChange={e => setE2ePhrase(e.target.value)}
                   onKeyDown={e => e.key === "Enter" && applyPhrase()} />
            <Button variant={e2eOn ? "secondary" : "primary"} disabled={e2eBusy}
                    onClick={applyPhrase}>
              {e2eOn ? "Сменить" : "Включить"}
            </Button>
          </div>
        </Field>

        {e2eOn &&
          <Field label="Когда шифрование включено"
                 hint="Ссылка вида …/room#k=… открывает комнату уже расшифрованной. Ключ едет во фрагменте адреса, а фрагмент на сервер не отправляется.">
            <div style={{ display: "grid", gap: 8 }}>
              <Button variant="secondary" block icon={copied ? "check" : "copy"}
                      onClick={copyKeyInvite}>
                {copied ? "Скопировано" : "Скопировать ссылку с ключом"}
              </Button>
              <Button variant="ghost" block size="sm" onClick={disableE2e}>
                Отключить шифрование
              </Button>
            </div>
          </Field>}

        <p className="set-note">
          Шифруются видео, голос, звук демонстрации, сообщения и картинки чата —
          AES-256-GCM прямо в браузере. Участник без ключа видит плитки
          «зашифровано» и не может прочитать переписку. Десктопный клиент
          понимает тот же формат: одна фраза работает и там, и здесь.
        </p>
      </>;

      case "keys": return <>
        <Field label="Сочетания клавиш"
               hint="Работают, пока открыта вкладка конференции и курсор не в поле ввода.">
          <div>
            {[["M", "Микрофон"], ["V", "Камера"], ["D", "Общий звук"],
              ["F", "Демонстрация во весь экран"], ["← →", "Страницы плиток"],
              ["Esc", "Закрыть окно или выйти из полного экрана"]].map(pair => (
              <div className="set-kv" key={pair[0]}>
                <b>{pair[1]}</b><span><kbd>{pair[0]}</kbd></span>
              </div>
            ))}
          </div>
        </Field>
        <p className="set-note">
          Переназначить их нельзя, и глобальными они не бывают: браузер не
          отдаёт странице нажатия, пока вы работаете в другом окне. В
          десктопном клиенте клавиши настраиваются и срабатывают поверх любой
          программы — это, пожалуй, главное, ради чего его стоит держать.
        </p>
      </>;

      case "iface": return <>
        <Field label="Тема">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <Button variant={theme === "dark" ? "primary" : "secondary"} icon="moon"
                    onClick={() => setTheme("dark")}>Тёмная</Button>
            <Button variant={theme === "light" ? "primary" : "secondary"} icon="sun"
                    onClick={() => setTheme("light")}>Светлая</Button>
          </div>
        </Field>

        <Field label="Плиток на странице" htmlFor="set-perpage"
               hint="«Автоматически» — девять на компьютере, шесть на телефоне.">
          <select id="set-perpage" className="set-select" value={perPagePref}
                  onChange={e => { setPerPagePref(e.target.value); setPref("perPage", e.target.value); }}>
            <option value="auto">Автоматически</option>
            <option value="4">4</option>
            <option value="6">6</option>
            <option value="9">9</option>
            <option value="12">12</option>
          </select>
        </Field>

        <Field label="Сетка участников">
          <div style={{ display: "grid", gap: 8 }}>
            <Toggle on={showSelf} label="Показывать себя в сетке"
                    sub="Своё видео всё равно видно в предпросмотре камеры"
                    onToggle={() => { const v = !showSelf; setShowSelf(v); setPref("showSelf", v); }} />
            <Toggle on={hideNoVideo} label="Скрывать участников без видео"
                    sub="В большой комнате остаются только те, кого видно"
                    onToggle={() => { const v = !hideNoVideo; setHideNoVideo(v); setPref("hideNoVideo", v); }} />
          </div>
        </Field>
        <p className="set-note">
          Закреплённого и того, кто ведёт демонстрацию, эти настройки не
          прячут никогда — иначе сцена осталась бы без хозяина.
        </p>
      </>;

      case "diag": {
        const s = engine.stats();
        const m = diag || { rxKbps: 0, txKbps: 0, rxFps: 0, txFps: 0 };
        return <>
          <Field label="Соединение">
            <div>
              <KV k="Задержка до сервера" v={ping == null ? "—" : ping + " мс"} />
              <KV k="Приём" v={m.rxKbps + " кбит/с · " + m.rxFps + " кадр/с"} />
              <KV k="Отправка" v={m.txKbps + " кбит/с · " + m.txFps + " кадр/с"} />
              <KV k="Очередь в сокете" v={Math.round(s.buffered / 1024) + " КБ"} />
            </div>
          </Field>

          <Field label="Кодеки"
                 hint="Проценты — насколько сеть прижала полосу. 100% значит, что пресет отдаётся целиком.">
            <div>
              <KV k="Камера" v={s.camCodec + " · " + Math.round(s.camRate * 100) + "%"} />
              <KV k="Демонстрация" v={s.screenCodec + " · " + Math.round(s.screenRate * 100) + "%"} />
              <KV k="Звук" v={s.audioCodec} />
              <KV k="Шифрование" v={s.encrypted ? "включено" : "выключено"} />
            </div>
          </Field>

          <Button variant="secondary" block icon={copied ? "check" : "copy"}
                  onClick={() => copyText(diagReport())}>
            {copied ? "Скопировано" : "Скопировать отчёт"}
          </Button>
          <p className="set-note">
            Потерь пакетов здесь нет и не будет: всё идёт по TCP — данные не
            теряются, а опаздывают. Признак затора — растущая очередь в сокете
            и просевший процент битрейта.
          </p>
        </>;
      }

      case "about": return <>
        <Field label="MeetUp">
          <div>
            <KV k="Сервер" v={location.host} />
            <KV k="Комната" v={roomTitle ? roomTitle + " · #" + roomCode : "#" + roomCode} />
            <KV k="Протокол" v="Бинарный v2 поверх WebSocket" />
          </div>
        </Field>

        <Field label="Что умеет этот браузер"
               hint="Отправляем мы всегда H.264. Список приёма объясняет, почему у одних чужая демонстрация идёт как есть, а у других отправитель спускается на H.264.">
          <div>
            <KV k="Кодирование" v={engine.stats().encodeOk.join(", ") || "нет — идёт запасной JPEG"} />
            <KV k="Декодирование" v={decodeOk ? (decodeOk.join(", ") || "нет") : "проверяем…"} />
            <KV k="Выбор динамиков" v={sinkSupported ? "есть" : "нет"} />
            <KV k="Демонстрация экрана" v={shareSupported ? "есть" : "нет"} />
          </div>
        </Field>

        <p className="set-note">
          Открытый исходный код:{" "}
          <a href="https://github.com/vi5vi5vi5/MeetUp" target="_blank" rel="noopener noreferrer">
            github.com/vi5vi5vi5/MeetUp
          </a>. Сервер, на котором идёт этот разговор, поднял тот, кто дал вам ссылку.
        </p>
      </>;

      default: return null;
      }
    }

    const participantRows = [{ id: "self", name: nameRef.current || "Вы", you: true, muted: !mic }]
      .concat(peers.map(p => ({ id: p.id, name: p.name, you: false, muted: !p.mic })));

    return (
      <div className={"conf" + (theater && screenActive && !screenSelf ? " theater" : "")}
           style={{ background: "var(--bg)", color: "var(--text)", fontFamily: "var(--font-ui)" }}>
        {/* stage */}
        <div className="stage">
          <div className="confbar">
            <div className="conf-mark">MeetUp</div>
            <h1 className="conf-title" title={roomTitle || undefined}>
              {roomTitle || <>Комната <span style={{ color: "var(--accent-ink)" }}>#{roomCode.slice(0, 6)}</span></>}
            </h1>
            <span style={{ flex: 1 }} />
            {phase === "live" && !reconnecting &&
              <Badge tone="live" dot>в эфире · {elapsed}</Badge>}
            {reconnecting &&
              <Badge tone="danger" dot>переподключение…</Badge>}
            {phase === "connecting" && !reconnecting &&
              <Badge tone="muted" dot>подключение…</Badge>}
            {e2eOn &&
              <span title="Сквозное шифрование включено: видео, голос и чат зашифрованы ключом участников">
                <Badge tone="accent">E2E 🔒</Badge>
              </span>}
            {phase === "live" && ping != null &&
              <span title="Задержка до сервера (туда-обратно)">
                <Badge tone={pingTone(ping)}>{ping + " мс"}</Badge>
              </span>}
            <IconButton icon="copy" size="sm" label="Скопировать ссылку-приглашение" onClick={openShare} />
            <IconButton icon={theme === "dark" ? "sun" : "moon"} size="sm" label="Сменить тему" onClick={toggleTheme} />
          </div>

          <div className="gridwrap"
               onTouchStart={pages > 1 ? onTouchStart : undefined}
               onTouchEnd={pages > 1 ? onTouchEnd : undefined}>
            {stageMode ? <>
              <div className="film">
                {tiles.map((t, i) => renderTile(t, i, true))}
              </div>
              <div className="stagebox"
                   onClick={pinActive ? () => setPinnedId(null) : undefined}
                   onDoubleClick={!pinActive && screenActive && !screenSelf ? toggleTheater : undefined}
                   style={pinActive ? { cursor: "zoom-out" } : undefined}>
                {pinActive ? <>
                  {stagePinMedia()}
                  <div className="stage-chip">
                    <Icon name="video" size={14} />
                    {(pinnedTile.self ? "Вы" : pinnedTile.name) + " — нажмите, чтобы вернуть"}
                  </div>
                </> : <>
                  {screenSelf
                    ? <video ref={stageSelfRef} className="stage-media" autoPlay muted playsInline />
                    : lockedIds.has(screenId)
                      // Демонстрация зашифрована, ключа нет: canvas не рисуем
                      // вовсе, иначе на нём висел бы последний открытый кадр.
                      ? <div className="tile-lock">
                          <div><b>🔒</b>Зашифровано — нужен ключ</div>
                        </div>
                      : <canvas key={"scr" + screenId} className="stage-media"
                                ref={engine.screenSinkRef(screenId)} />}
                  {!stageReady && !lockedIds.has(screenId) &&
                    <div className="stage-wait">Демонстрация начинается…</div>}
                  <div className="stage-chip">
                    <Icon name="screen" size={14} />
                    {screenSelf ? "Вы демонстрируете экран" : "Демонстрация — " + (sharerName || "участник")}
                    {(screenSelf ? shareAudio : screenAudioIn) &&
                      <span style={{ color: "var(--accent-ink)" }}>· со звуком</span>}
                  </div>
                  <div className="stage-tools" onClick={(e) => e.stopPropagation()}>
                    {/* Ручка громкости — только у ЧУЖОЙ демонстрации и только
                        пока звук реально идёт: свою фонограмму себе не крутят,
                        а пустой ползунок сбивает с толку. */}
                    {!screenSelf && screenAudioIn &&
                      <div className={"scrvol" + (isMobile ? " open" : "")}>
                        <button onClick={toggleScreenMute}
                                aria-label={screenVol === 0 ? "Вернуть звук демонстрации" : "Приглушить демонстрацию"}
                                title={screenVol === 0 ? "Вернуть звук демонстрации" : "Приглушить демонстрацию"}>
                          <Icon name={screenVol === 0 ? "volume-off" : "volume"} size={18} />
                        </button>
                        <input type="range" className="set-range" min="0" max="200" step="5"
                               value={screenVol} aria-label="Громкость демонстрации"
                               onChange={(e) => changeScreenVol(+e.target.value)}
                               style={{ background: rangeFill(screenVol, 200) }} />
                        <span className="pct">{screenVol}%</span>
                      </div>}
                    <button className="stage-btn" onClick={toggleTheater}
                            aria-label={theater ? "Свернуть" : "Во весь экран"}
                            title={theater ? "Свернуть (Esc)" : "Во весь экран"}>
                      <Icon name={theater ? "minimize" : "maximize"} size={18} />
                    </button>
                  </div>
                </>}
              </div>
            </> : (
              <div className="grid" style={gridStyle}>
                {visible.map((t, i) => renderTile(t, i, false))}
              </div>
            )}

            {pages > 1 && <>
              <IconButton icon="arrow-right" label="Предыдущая страница" disabled={curPage === 0}
                          onClick={() => setPage(p => Math.max(0, p - 1))}
                          style={{ position: "absolute", left: 34, top: "50%",
                                   transform: "translateY(-50%) rotate(180deg)", zIndex: 30 }} />
              <IconButton icon="arrow-right" label="Следующая страница" disabled={curPage === pages - 1}
                          onClick={() => setPage(p => Math.min(pages - 1, p + 1))}
                          style={{ position: "absolute", right: 34, top: "50%",
                                   transform: "translateY(-50%)", zIndex: 30 }} />
              <div className="pager-dots">
                {Array.from({ length: pages }).map((_, i) => (
                  <button key={i} className={"pager-dot" + (i === curPage ? " on" : "")}
                          aria-label={"Страница " + (i + 1)} onClick={() => setPage(i)} />
                ))}
              </div>
            </>}
          </div>

          <div className="dock">
            <div className="dockbar">
              <IconButton size={dockSize} icon={mic ? "mic" : "mic-off"}
                          variant={mic ? "neutral" : "off"}
                          label={mic ? "Выключить микрофон" : "Включить микрофон"}
                          onClick={() => toggleMic(true)} />
              <IconButton size={dockSize} icon={cam ? "video" : "video-off"}
                          variant={cam ? "neutral" : "off"}
                          label={cam ? "Выключить камеру" : "Включить камеру"}
                          onClick={toggleCamera} />
              <IconButton size={dockSize} icon={deafened ? "volume-off" : "volume"}
                          variant={deafened ? "off" : "neutral"}
                          label={deafened ? "Включить звук конференции" : "Не слышать участников"}
                          onClick={toggleSound} />
              {/* getDisplayMedia на телефонах не работает ни в одном браузере —
                  кнопку там не показываем вовсе, а не показываем неработающей. */}
              {!isMobile &&
                <IconButton size={dockSize} icon="screen" variant={sharing ? "active" : "neutral"}
                            label="Демонстрация экрана" onClick={toggleShare} />}
              <IconButton size={dockSize} icon="settings"
                          variant={settingsOpen ? "active" : "neutral"}
                          label="Настройки" onClick={openSettings} />
              <span className="dock-sep" />
              <IconButton size={dockSize} icon="phone-off" variant="danger" wide
                          label="Завершить" onClick={leave} />
            </div>
          </div>

          {notice && <div className="notice">{notice}</div>}

          {peerVol && <>
            <div className="peervol-scrim" onClick={() => setPeerVol(null)} />
            <div className="peervol" role="dialog" aria-modal="true" aria-label="Громкость участника">
              <h3>{peerVol.name}</h3>
              <p className="sub">Только для вас — остальные слышат его как обычно.</p>
              <div className="row">
                <Icon name={peerVol.vol === 0 ? "volume-off" : "volume"} size={18} />
                <input type="range" className="set-range" min="0" max="200" step="5"
                       value={peerVol.vol} aria-label="Громкость участника"
                       onChange={(e) => changePeerVol(peerVol.id, +e.target.value)}
                       style={{ margin: 0, background: rangeFill(peerVol.vol, 200) }} />
                <span style={{ flex: "none", width: 42, textAlign: "right",
                               fontSize: "var(--text-xs)", fontWeight: 700 }}>{peerVol.vol}%</span>
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                <Button variant="ghost" size="sm" onClick={() => changePeerVol(peerVol.id, 100)}>
                  Сбросить
                </Button>
                <span style={{ flex: 1 }} />
                <Button variant="primary" size="sm" onClick={() => setPeerVol(null)}>Готово</Button>
              </div>
            </div>
          </>}

          <button className="chat-fab" onClick={() => { setPanelOpen(true); setTab("chat"); }}>
            <Icon name="chat" size={18} />
            Чат
            {unread > 0 && <span className="badge-n">{unread}</span>}
          </button>

          {/* поповер «поделиться» */}
          {shareOpen && <>
            <div className="share-scrim" onClick={() => setShareOpen(false)} />
            <div className="share-pop">
              <Card elevated width="100%">
                <div className="share-label">Ссылка-приглашение</div>
                <Input readOnly value={inviteUrl} onFocus={(e) => e.target.select()} />
                <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                  <Button variant="primary" block icon={copied ? "check" : "copy"} onClick={copyInvite}>
                    {copied ? "Скопировано" : "Копировать"}
                  </Button>
                  {navigator.share &&
                    <IconButton icon="arrow-right" label="Поделиться…"
                                onClick={() => navigator.share({ title: "MeetUp — конференция", url: inviteUrl }).catch(() => {})} />}
                </div>
                {e2eOn &&
                  <Button variant="secondary" block icon="copy" style={{ marginTop: 8 }}
                          onClick={copyKeyInvite}>
                    Ссылка с ключом E2E
                  </Button>}
                <div className="share-hint">
                  {e2eOn
                    ? "Обычная ссылка не содержит ключ: вошедший по ней увидит «зашифровано»."
                    : "По ссылке входят без аккаунта: имя — и сразу в эфир."}
                </div>
              </Card>
            </div>
          </>}
        </div>

        {/* side panel */}
        <div className={"side" + (panelOpen ? " open" : "")}>
          <div className="side-head">
            <span style={{ fontFamily: "var(--font-label)", fontWeight: 700, fontSize: 12,
                           letterSpacing: 2, textTransform: "uppercase", color: "var(--text-muted)" }}>Панель</span>
            <IconButton icon="x" size="sm" label="Закрыть" onClick={() => setPanelOpen(false)} />
          </div>
          <div className="tabs">
            <button className="tab" style={tabStyle("chat")} onClick={() => setTab("chat")}>
              Чат{unread > 0 && tab !== "chat" ? " (" + unread + ")" : ""}
            </button>
            <button className="tab" style={tabStyle("people")} onClick={() => setTab("people")}>
              Участники ({participantRows.length})
            </button>
          </div>

          {tab === "people" ? (
            <div className="peoplescroll">
              {participantRows.map(p => (
                <ParticipantRow key={p.id} name={p.name} you={p.you} muted={p.muted} />
              ))}
            </div>
          ) : (
            <>
              <div ref={msgRef} className="chatscroll">
                {messages.map(m => (
                  <ChatMessage key={m.key} author={m.author} time={m.time} self={m.self}
                               text={msgContent(m)} />
                ))}
              </div>
              <div className="composer">
                <input ref={fileRef} type="file" accept="image/*"
                       style={{ display: "none" }} onChange={onPickImage} />
                <IconButton icon="paperclip" label="Прикрепить изображение"
                            onClick={() => fileRef.current && fileRef.current.click()} />
                <Input value={draft} placeholder="Сообщение…" autoComplete="off" maxLength={2000}
                       onChange={e => setDraft(e.target.value)}
                       onPaste={onComposerPaste}
                       onKeyDown={e => e.key === "Enter" && sendChat()} />
                <IconButton icon="send" variant="accent" label="Отправить" onClick={sendChat} />
              </div>
            </>
          )}
        </div>

        {/* настройки: устройства, громкость, чувствительность */}
        {settingsOpen && <>
          <div className="settings-scrim" onClick={closeSettings} />
          <div className="settings-pop" role="dialog" aria-modal="true" aria-label="Настройки">
            <div className={"set-panel " + (onSection ? "page" : "list")}>
              <div className="set-rail" role="tablist" aria-label="Разделы настроек">
                <div className="set-rail-head">
                  <span className="set-rail-title">Настройки</span>
                  <span className="set-rail-close">
                    <IconButton icon="x" size="sm" label="Закрыть настройки" onClick={closeSettings} />
                  </span>
                </div>
                {SECTIONS.map(s => (
                  <button key={s.id} type="button" role="tab"
                          aria-selected={section === s.id}
                          className={"set-item" + (section === s.id && !isMobile ? " on" : "")}
                          onClick={() => { setSection(s.id); setOnSection(true); }}>
                    <Icon name={s.icon} size={17} />
                    {s.title}
                    <span className="chev"><Icon name="arrow-right" size={15} /></span>
                  </button>
                ))}
              </div>

              <div className="set-body">
                <div className="set-head">
                  <span className="set-back">
                    <IconButton icon="arrow-right" size="sm" label="Назад к разделам"
                                style={{ transform: "rotate(180deg)" }}
                                onClick={() => setOnSection(false)} />
                  </span>
                  <div style={{ minWidth: 0, flex: 1 }}>
                    <h2 className="set-title">{curSection.title}</h2>
                    <p className="set-sub">{curSection.sub}</p>
                  </div>
                  <IconButton icon="x" size="sm" label="Закрыть" onClick={closeSettings} />
                </div>
                <div className="set-page">{renderSection()}</div>
              </div>
            </div>
          </div>
        </>}

        {/* гейт входа по ссылке: имя (аноним) и пароль (личная комната) */}
        {phase === "gate" &&
          <div className="overlay">
            <div className="overlay-card">
              <Card elevated width="100%">
                <h2 className="overlay-title">Присоединиться</h2>
                <p className="overlay-sub">
                  {roomTitle ? <>Комната «<b>{roomTitle}</b>»</> : <>Комната <b>#{roomCode.slice(0, 6)}</b></>}.{" "}
                  {needPass ? "Вход по паролю — спросите его у владельца." : "Представьтесь — и вы в эфире."}
                </p>
                {!nameRef.current &&
                  <Field label="Ваше имя" htmlFor="gate-name">
                    <Input id="gate-name" autoFocus value={gateName} maxLength={40} placeholder="Анна"
                           autoComplete="name"
                           onChange={e => setGateName(e.target.value)}
                           onKeyDown={e => e.key === "Enter" && gateSubmit()} />
                  </Field>}
                {needPass &&
                  <Field label="Пароль комнаты" htmlFor="gate-pass"
                         style={!nameRef.current ? { marginTop: 14 } : undefined}>
                    <Input id="gate-pass" type="password" value={gatePass} maxLength={128}
                           placeholder="••••••" autoFocus={!!nameRef.current}
                           onChange={e => { setGatePass(e.target.value); setGateErr(""); }}
                           onKeyDown={e => e.key === "Enter" && gateSubmit()} />
                  </Field>}
                {gateErr &&
                  <p style={{ color: "var(--danger)", fontSize: 13, margin: "10px 0 0" }}>{gateErr}</p>}
                <Button variant="primary" block iconRight="arrow-right" style={{ marginTop: 20 }}
                        disabled={!(nameRef.current || gateName.trim()) || (needPass && !gatePass)}
                        onClick={gateSubmit}>
                  Подключиться
                </Button>
                <Button variant="ghost" block style={{ marginTop: 10 }}
                        onClick={() => { location.href = exitHref; }}>
                  {exitLabel}
                </Button>
              </Card>
            </div>
          </div>}

        {/* личная комната не в эфире: ждём владельца, join повторяется сам */}
        {phase === "waiting" &&
          <div className="overlay">
            <div className="overlay-card">
              <Card elevated width="100%">
                <h2 className="overlay-title">{roomTitle || "Комната закрыта"}</h2>
                <p className="overlay-sub">
                  Владелец ещё не открыл комнату. Оставайтесь на странице —
                  как только он появится, вы войдёте автоматически.
                </p>
                <Badge tone="muted" dot>ждём владельца…</Badge>
                <Button variant="ghost" block style={{ marginTop: 16 }}
                        onClick={() => { location.href = exitHref; }}>
                  {exitLabel}
                </Button>
              </Card>
            </div>
          </div>}

        {/* картинка из чата на весь экран */}
        {lightbox &&
          <div className="lightbox" onClick={() => setLightbox(null)}>
            <img src={lightbox} alt="изображение из чата" />
          </div>}

        {/* ошибка подключения */}
        {phase === "error" &&
          <div className="overlay">
            <div className="overlay-card">
              <Card elevated width="100%">
                <h2 className="overlay-title">Не получилось</h2>
                <p className="overlay-sub">{errText}</p>
                <Button variant="primary" block style={{ marginTop: 8 }}
                        onClick={() => location.reload()}>
                  Попробовать снова
                </Button>
                <Button variant="ghost" block style={{ marginTop: 10 }}
                        onClick={() => { location.href = exitHref; }}>
                  {exitLabel}
                </Button>
              </Card>
            </div>
          </div>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<ConferenceScreen />);
</script>

</body>
</html>
