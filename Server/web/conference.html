<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetUp — Конференция</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/brand/meetup-mark-auto.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/brand/meetup-avatar-512.png">
<!-- Ссылку на комнату кидают в мессенджер чаще всех остальных — превью
     здесь самое важное. Адрес картинки абсолютный: относительный
     разворачивают не все клиенты. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Подключиться к видеовстрече — MeetUp">
<meta property="og:description" content="Открывается прямо в браузере: ни установки, ни регистрации.">
<meta property="og:image" content="https://meetup.linkpc.net/assets/brand/meetup-og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  html, body { height: 100%; margin: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-ui);
    font-size: var(--text-md); line-height: var(--leading-base);
    transition: background .24s var(--ease);
  }
  #root { position: fixed; inset: 0; }
  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { opacity: .8; }
  ::selection { background: var(--accent); color: var(--on-accent); }

  .conf { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 340px; }
  .stage { display: flex; flex-direction: column; min-width: 0; position: relative; }

  .confbar { display: flex; align-items: center; gap: 12px; padding: 20px 26px; flex-wrap: wrap; }
  .conf-mark {
    font-family: var(--font-label); font-weight: 700; font-size: 15px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted);
  }
  .conf-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.8px;
                min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .gridwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .grid {
    flex: 1; min-height: 0; display: grid; gap: var(--gap-grid);
    grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; padding: 4px 26px 128px;
  }

  /* видео/кадры внутри плитки */
  .tile-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* аватарка вместо выключенной камеры: кружок по центру, как в шапке */
  .tile-ava { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .tile-ava img {
    width: 38%; max-width: 96px; min-width: 40px; aspect-ratio: 1;
    border-radius: 50%; object-fit: cover;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .28);
  }
  .stage-ava img { max-width: 168px; width: 20%; min-width: 72px; }
  .mirror { transform: scaleX(-1); }

  /* Демонстрация экрана: плёнка камер сверху + сцена. contain, а не cover —
     экран нельзя ни обрезать, ни растягивать. */
  .film { flex: none; display: flex; gap: 10px; overflow-x: auto; padding: 4px 26px 10px; }
  .film-cell { flex: none; width: 168px; height: 96px; }
  .stagebox {
    flex: 1; min-height: 0; position: relative; margin: 0 26px 128px;
    background: linear-gradient(160deg, var(--tile-from), var(--tile-to));
    border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
  }
  .stage-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .stage-wait {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--text-muted); font-size: var(--text-sm); font-weight: var(--weight-semibold);
  }
  .stage-chip {
    position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px;
    background: var(--scrim-chip); backdrop-filter: var(--blur-chip); -webkit-backdrop-filter: var(--blur-chip);
    padding: 5px 10px; border-radius: var(--radius-xs);
    font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text);
  }

  /* всплывающее уведомление над доком (демонстрация занята и т.п.) */
  .notice {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 100px; z-index: 45;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 10px 18px; font-size: var(--text-sm); font-weight: var(--weight-semibold);
    box-shadow: var(--shadow-pop); white-space: nowrap; max-width: calc(100% - 32px);
    overflow: hidden; text-overflow: ellipsis;
  }

  /* картинки в чате */
  .chat-img {
    display: block; max-width: 100%; max-height: 260px; border-radius: 8px;
    cursor: zoom-in; object-fit: contain;
  }
  .chat-img-stub { opacity: .75; font-style: italic; }
  .lightbox {
    position: fixed; inset: 0; z-index: 120; display: grid; place-items: center;
    padding: 24px; cursor: zoom-out;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
  }
  .lightbox img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: var(--radius-md); box-shadow: var(--shadow-pop);
  }

  /* пагинация плиток: стрелки по краям + точки над доком */
  .pager-dots {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 108px;
    display: flex; gap: 8px; z-index: 30;
  }
  .pager-dot {
    width: 8px; height: 8px; border-radius: var(--radius-pill); border: none; padding: 0;
    background: var(--border-strong); cursor: pointer; transition: var(--transition);
  }
  .pager-dot.on { background: var(--accent); width: 22px; }

  .dock { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: calc(100% - 32px); }
  /* Док собран здесь, а не взят из дизайн-системы: там жёстко зашиты пять
     кнопок без «общего звука», а на телефоне доку нужен компактный размер. */
  .dockbar {
    display: inline-flex; align-items: center; gap: var(--gap-inline);
    padding: 10px; border-radius: var(--radius-lg);
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: var(--shadow-pop);
  }
  .dock-sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 2px; }

  /* Кнопки на самой демонстрации: во весь экран и громкость её звука. */
  .stage-tools {
    position: absolute; right: 12px; bottom: 12px; z-index: 6;
    display: flex; align-items: center; gap: 8px;
  }
  .stage-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0; cursor: pointer;
    border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--scrim-chip); backdrop-filter: var(--blur-chip);
    -webkit-backdrop-filter: var(--blur-chip);
    color: var(--text); transition: var(--transition);
  }
  .stage-btn:hover { background: var(--surface-2); }

  /* Громкость демонстрации: пилюля, которая разъезжается по наведению.
     В свёрнутом виде это просто значок, в развёрнутом — ползунок и проценты.
     Ручка у СЛУШАТЕЛЯ, а не у ведущего: иначе один решал бы за всю комнату. */
  .scrvol {
    display: flex; align-items: center; gap: 8px; height: 36px;
    padding: 0 8px; overflow: hidden;
    border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--scrim-chip); backdrop-filter: var(--blur-chip);
    -webkit-backdrop-filter: var(--blur-chip);
    color: var(--text); width: 36px; transition: width .18s var(--ease);
  }
  .scrvol:hover, .scrvol.open { width: 190px; }
  .scrvol > button {
    background: none; border: none; padding: 0; margin: 0; cursor: pointer;
    color: inherit; display: inline-flex; flex: none;
  }
  .scrvol .set-range { margin: 0; flex: 1; min-width: 0; }
  .scrvol .pct { font-size: var(--text-2xs); font-weight: 700; flex: none; width: 34px; text-align: right; }

  /* Демонстрация во весь экран: шапка, плёнка, док и панель уходят,
     сцена занимает всё. Полноэкранный API просим дополнительно — на iOS
     его для произвольных элементов нет, и режим должен работать и без него. */
  .conf.theater { grid-template-columns: 1fr; }
  .conf.theater .confbar,
  .conf.theater .film,
  .conf.theater .side,
  .conf.theater .dock,
  .conf.theater .chat-fab,
  .conf.theater .pager-dots { display: none !important; }
  .conf.theater .stagebox { margin: 0; border-radius: 0; border: none; }

  /* Личная громкость участника (правая кнопка / долгий тап по плитке). */
  .peervol-scrim { position: fixed; inset: 0; z-index: 100; background: color-mix(in srgb, var(--bg) 55%, transparent); }
  .peervol {
    position: fixed; z-index: 101; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 300px; max-width: calc(100vw - 32px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 18px;
  }
  .peervol h3 { margin: 0 0 2px; font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: -.4px; }
  .peervol .sub { margin: 0 0 14px; color: var(--text-muted); font-size: var(--text-xs); }
  .peervol .row { display: flex; align-items: center; gap: 10px; }

  /* поповер «поделиться ссылкой» */
  .share-scrim { position: fixed; inset: 0; z-index: 70; background: transparent; }
  .share-pop { position: absolute; top: 72px; right: 26px; z-index: 80; width: 360px; max-width: calc(100vw - 32px); }
  .share-label {
    font-family: var(--font-label); font-weight: 700; font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
  }
  .share-hint { margin-top: 12px; font-size: var(--text-xs); color: var(--text-faint); }

  /* оверлеи: гейт имени (вход по ссылке) и ошибка */
  .overlay { position: absolute; inset: 0; z-index: 90; display: grid; place-items: center; background: var(--bg); padding: 20px; }
  .overlay-card { width: 100%; max-width: 400px; }
  .overlay-title { margin: 0 0 6px; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.8px; }
  .overlay-sub { margin: 0 0 20px; color: var(--text-muted); font-size: var(--text-sm); overflow-wrap: anywhere; }

  /* модалка настроек: устройства, громкость, чувствительность */
  .settings-scrim {
    position: fixed; inset: 0; z-index: 95;
    background: color-mix(in srgb, var(--bg) 62%, transparent);
  }
  .settings-pop {
    position: fixed; inset: 0; z-index: 96; display: grid; place-items: center;
    padding: 20px; pointer-events: none;
  }
  /* Настройки — двухколоночный диалог: рельс разделов слева, страница
     справа. Прокрутка живёт ВНУТРИ раздела, поэтому появление новых
     настроек не двигает вёрстку остальных. */
  .set-panel {
    pointer-events: auto; display: grid; grid-template-columns: 236px 1fr;
    width: 100%; max-width: 840px; height: min(580px, calc(100dvh - 40px));
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden;
  }
  .set-rail {
    border-right: 1px solid var(--border); padding: 14px 10px;
    overflow: auto; display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .set-rail-head { display: flex; align-items: center; gap: 8px; padding: 0 4px 10px 0; }
  .set-rail-title {
    font-family: var(--font-label); font-weight: 700; font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--text-faint);
    padding: 4px 10px 0; flex: 1; min-width: 0;
  }
  /* На широком окне закрывает крестик в шапке раздела — второй был бы лишним.
     На телефоне правая панель спрятана вместе со своим крестиком, и без
     этого из списка разделов было бы не выйти вовсе. */
  .set-rail-close { display: none; }
  .set-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 10px; border: 1px solid transparent; border-radius: var(--radius-sm);
    background: none; color: var(--text-muted); cursor: pointer; text-align: left;
    font-family: var(--font-ui); font-size: var(--text-sm); font-weight: 600;
    transition: var(--transition);
  }
  .set-item:hover { background: var(--surface-2); color: var(--text); }
  .set-item.on {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    color: var(--accent-ink);
  }
  .set-item .chev { margin-left: auto; opacity: .5; display: none; }
  .set-body { display: flex; flex-direction: column; min-width: 0; }
  .set-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .set-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.5px; }
  .set-sub { margin: 2px 0 0; font-size: var(--text-xs); color: var(--text-muted); }
  .set-back { display: none; }
  .set-page { flex: 1; overflow: auto; padding: 18px 20px 24px; }
  .set-page > * + * { margin-top: 18px; }
  /* Тумблер: те же токены, что у остальных «включено» в системе. */
  .set-toggle {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font-family: var(--font-ui); font-size: var(--text-sm);
    font-weight: 600; cursor: pointer; text-align: left; transition: var(--transition);
  }
  .set-toggle:hover { border-color: var(--border-strong); }
  .set-toggle .knob {
    margin-left: auto; flex: none; width: 38px; height: 22px; border-radius: var(--radius-pill);
    background: var(--surface-3); border: 1px solid var(--border); position: relative;
    transition: var(--transition);
  }
  .set-toggle .knob::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--text-faint); transition: var(--transition);
  }
  .set-toggle.on .knob { background: color-mix(in srgb, var(--accent) 30%, transparent); border-color: var(--accent); }
  .set-toggle.on .knob::after { left: 18px; background: var(--accent); }
  .set-toggle .sub { display: block; font-weight: 400; font-size: var(--text-2xs); color: var(--text-muted); margin-top: 2px; }
  /* Строка «показатель — значение» в диагностике и «о программе». */
  .set-kv { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: var(--text-sm); }
  .set-kv:last-child { border-bottom: none; }
  .set-kv b { flex: none; width: 46%; font-weight: 600; color: var(--text-muted); }
  .set-kv span { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .set-note { font-size: var(--text-xs); color: var(--text-faint); }
  .set-kv kbd {
    font-family: var(--font-mono); font-size: var(--text-xs);
    padding: 2px 7px; border-radius: var(--radius-xs);
    background: var(--surface-2); border: 1px solid var(--border-strong);
  }
  .set-select {
    width: 100%; padding: var(--pad-input);
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    font-size: var(--text-md); font-family: var(--font-ui); font-weight: var(--weight-medium);
    outline: none; transition: var(--transition);
  }
  .set-select:focus { border-color: var(--accent-ink); }
  .set-select:disabled { opacity: .55; cursor: not-allowed; }
  /* Ползунок: трек рисуем сами (accent-color в Chrome даёт грязный трек
     на светлой теме); заполненная часть — инлайн-градиент от значения. */
  .set-range {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; margin: 12px 0 4px;
    border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--surface-3);
    outline: none; cursor: pointer;
  }
  .set-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface);
    box-shadow: var(--shadow-pop); cursor: grab;
  }
  .set-range::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface);
    box-shadow: var(--shadow-pop); cursor: grab;
  }
  .mic-meter {
    height: 6px; margin-top: 10px; border-radius: var(--radius-pill);
    background: var(--surface-2); border: 1px solid var(--border); overflow: hidden;
  }
  .mic-meter-fill {
    height: 100%; width: 0; background: var(--accent);
    border-radius: var(--radius-pill); transition: width .08s linear;
  }

  /* плитка участника, чей поток зашифрован чужим ключом */
  .tile-lock {
    position: absolute; inset: 0; z-index: 2;
    display: grid; place-items: center; text-align: center; padding: 12px;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    color: var(--text-muted); font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
  }
  .tile-lock b { display: block; font-size: 26px; margin-bottom: 6px; }

  .side {
    border-left: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head { display: none; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
  .tabs { display: flex; gap: 4px; padding: 16px 16px 0; }
  .tab {
    flex: 1; padding: 10px; border-radius: var(--radius-md); cursor: pointer;
    font-family: var(--font-ui); font-weight: 700; font-size: 13px; transition: var(--transition);
  }
  .chatscroll { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .peoplescroll { flex: 1; overflow: auto; padding: 12px 8px; }
  .composer { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--border); }

  .mobile-only { display: none !important; }

  .chat-fab {
    display: none; position: absolute; right: 20px; bottom: 96px; z-index: 40;
    align-items: center; gap: 8px; padding: 12px 18px;
    border: 1px solid transparent; border-radius: var(--radius-pill);
    background: var(--accent); color: var(--on-accent);
    font-family: var(--font-ui); font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: var(--shadow-pop);
  }
  .chat-fab .badge-n {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--on-accent); color: var(--accent-ink);
    font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
  }

  /* ---- Mobile ---- */
  @media (max-width: 820px) {
    .conf { grid-template-columns: 1fr; }
    .confbar { padding: 14px 16px; gap: 10px; }
    .conf-title { font-size: 19px; }
    .grid { padding: 4px 16px 132px; }
    .film { padding: 4px 16px 8px; }
    .film-cell { width: 128px; height: 74px; }
    .stagebox { margin: 0 16px 132px; }
    .dock { bottom: 20px; }
    .stage-tools { right: 10px; bottom: 10px; }
    .pager-dots { bottom: 102px; }
    .share-pop { right: 16px; top: 64px; }
    .side {
      position: fixed; inset: 0; z-index: 60; border-left: none;
      transform: translateX(100%); transition: transform .2s var(--ease);
    }
    .side.open { transform: none; }
    .side-head { display: flex; }
    /* Настройки на телефоне: тот же список разделов, но во весь экран и с
       переходом «список → раздел → назад». Компонент один, раскладки две. */
    .settings-pop { padding: 0; }
    .set-panel {
      grid-template-columns: 1fr; max-width: none;
      height: 100dvh; border-radius: 0; border: none;
    }
    .set-panel.list .set-body { display: none; }
    .set-panel.page .set-rail { display: none; }
    .set-item { padding: 13px 12px; font-size: var(--text-md); }
    .set-item .chev { display: block; }
    .set-back { display: inline-flex; }
    .set-rail-close { display: inline-flex; }
    .set-rail-head { padding: 4px 4px 10px 0; }
    .tabs { padding: 8px 16px 0; }
    .mobile-only { display: inline-flex !important; }
    .chat-fab { display: inline-flex; }
  }
</style>
</head>
<body>

<div id="root"></div>
<script src="assets/react.js"></script>
<script src="assets/react-dom.js"></script>
<script src="assets/babel.js"></script>
<script src="assets/meetup-ds.js?v=4"></script>
<script src="assets/meetup-common.js?v=4"></script>
<script src="assets/meetup-media.js?v=4"></script>
<script type="text/babel">
  const { useState, useRef, useEffect } = React;
  // ControlDock из дизайн-системы здесь больше не берём: в нём жёстко зашиты
  // пять кнопок без «общего звука», а доку нужен ещё и компактный размер на
  // телефоне — он собран на странице (см. .dockbar).
  const { Badge, Icon, IconButton, Input, Field, Button, Card, VideoTile, ParticipantRow, ChatMessage } =
    window.MeetUpDesignSystem_2584b5;

  // Бинарный протокол, кодеки и E2E-шифрование живут в assets/meetup-media.js.
  const roomCode = new URLSearchParams(location.search).get("room") || "";

  function fmtTime(ms) {
    return new Date(Number(ms)).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }

  // ---- Локальные настройки звука и устройств (общие для всех комнат) ----
  const AV_KEY = "meetup.av";
  const clampPct = (v) => Math.max(0, Math.min(200, Number(v) || 0));

  // Уровни качества отправки: пресеты битрейтов живут в meetup-media.js,
  // страница хранит выбор и разрешение захвата камеры под него.
  const Q_LEVELS = ["low", "med", "high"];
  const CAM_RES = { low: { width: 640, height: 360 },
                    med: { width: 1280, height: 720 },
                    high: { width: 1920, height: 1080 } };
  const Q_LABELS = {
    cam: { low: "360p · эко", med: "720p", high: "1080p" },
    screen: { low: "Эко", med: "Стандарт", high: "Плавное" },
    audio: { low: "16 кбит/с", med: "32 кбит/с", high: "64 кбит/с" },
  };

  // Сколько плиток на странице. "auto" — по ширине окна (9 на компьютере,
  // 6 на телефоне); остальное человек выбрал сам и знает, что делает.
  const PER_PAGE = ["auto", "4", "6", "9", "12"];

  function loadAvSettings() {
    const def = { micId: "", camId: "", outId: "", volume: 100, sens: 100,
                  qCam: "med", qScreen: "med", qAudio: "med",
                  // Обработка голоса — браузерная (WebRTC APM). Она работает
                  // до нашего захвата: в worklet приходит уже очищенный трек.
                  noise: true, echo: true, agc: true,
                  // Интерфейс
                  mirror: true, perPage: "auto", hideNoVideo: false, showSelf: true };
    let s = def;
    try { s = { ...def, ...JSON.parse(localStorage.getItem(AV_KEY) || "{}") }; } catch (e) {}
    s.volume = clampPct(s.volume);
    s.sens = clampPct(s.sens);
    for (const k of ["qCam", "qScreen", "qAudio"])
      if (!Q_LEVELS.includes(s[k])) s[k] = "med";
    if (!PER_PAGE.includes(String(s.perPage))) s.perPage = "auto";
    for (const k of ["noise", "echo", "agc", "mirror", "hideNoVideo", "showSelf"])
      s[k] = !!s[k];
    return s;
  }

  function saveAvSettings(patch) {
    try { localStorage.setItem(AV_KEY, JSON.stringify({ ...loadAvSettings(), ...patch })); }
    catch (e) { /* приватный режим — настройки живут до перезагрузки */ }
  }

  // Выбор устройства вывода работает через AudioContext.setSinkId —
  // есть в Chrome/Edge/Firefox, в Safari пока нет.
  const sinkSupported = !!(window.AudioContext && "setSinkId" in AudioContext.prototype);

  // Демонстрация экрана: на телефонах getDisplayMedia не реализован ни в
  // одном браузере — кнопку там не показываем вовсе, а не показываем
  // неработающей.
  const shareSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);

  // Разделы настроек. Порядок и названия — как в десктопном клиенте:
  // человек, знакомый с одним, находит нужное во втором не глядя.
  const SECTIONS = [
    { id: "audio",  icon: "mic",      title: "Звук",         sub: "Микрофон, динамики и качество передачи голоса" },
    { id: "video",  icon: "video",    title: "Видео",        sub: "Камера и параметры вашей трансляции" },
    { id: "share",  icon: "screen",   title: "Демонстрация", sub: "Что видят собеседники, когда вы показываете экран" },
    { id: "crypto", icon: "lock",     title: "Шифрование",   sub: "Сквозное шифрование медиа и переписки" },
    { id: "keys",   icon: "keyboard", title: "Управление",   sub: "Сочетания клавиш в этой вкладке" },
    { id: "iface",  icon: "layout",   title: "Интерфейс",    sub: "Тема и сетка участников" },
    { id: "diag",   icon: "activity", title: "Диагностика",  sub: "Живые показатели соединения и кодеков" },
    { id: "about",  icon: "info",     title: "О программе",  sub: "Сервер, протокол и возможности браузера" },
  ];

  // История посещённых комнат для главной страницы (localStorage, общий
  // на все вкладки). Хранится только в браузере — сервер её не ведёт.
  const HISTORY_KEY = "meetup.history";
  function recordVisit(code, title) {
    try {
      const list = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]")
        .filter(e => e && e.code !== code);
      list.unshift(title ? { code, at: Date.now(), title } : { code, at: Date.now() });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 8)));
    } catch (e) { /* приватный режим */ }
  }

  // Аватарки лежат на сервере одним файлом на пользователя; версия в URL
  // делает кэш вечным — после замены ссылка меняется сама.
  function avatarUrl(userId, ver) {
    return "/api/users/" + userId + "/avatar?v=" + ver;
  }

  // Секрет E2E на комнату (только в этой вкладке, на сервер не уходит):
  // "p:<фраза>" или "k:<base64-ключ из ссылки>".
  const E2E_KEY = "meetup.e2e." + roomCode;
  function loadE2eSecret() {
    try { return sessionStorage.getItem(E2E_KEY) || ""; } catch (e) { return ""; }
  }
  function saveE2eSecret(v) {
    try { v ? sessionStorage.setItem(E2E_KEY, v) : sessionStorage.removeItem(E2E_KEY); }
    catch (e) { /* приватный режим */ }
  }

  function ConferenceScreen() {
    const savedName = MeetUp.savedName();

    // ---- UI-состояние ----
    const [theme, setTheme] = useState("dark");
    // Стартуем с "connecting": гейт показывается только после того, как
    // /api/me ответил, что живой сессии аккаунта нет (и имени в запасе тоже).
    const [phase, setPhase] = useState("connecting"); // gate|connecting|waiting|live|error
    const [isAccount, setIsAccount] = useState(false);
    const [errText, setErrText] = useState("");
    const [gateName, setGateName] = useState("");
    // Личная комната: название (join_ok/чек по коду), пароль на гейте.
    const [roomTitle, setRoomTitle] = useState("");
    const [needPass, setNeedPass] = useState(false);
    const [gatePass, setGatePass] = useState("");
    const [gateErr, setGateErr] = useState("");
    const [myId, setMyId] = useState(null);
    const [peers, setPeers] = useState([]);          // {id, name, mic, cam}
    const [messages, setMessages] = useState([]);    // {key, author, time, text, self}
    const [unread, setUnread] = useState(0);
    const [draft, setDraft] = useState("");
    const [mic, setMic] = useState(true);
    const [cam, setCam] = useState(true);
    const [sharing, setSharing] = useState(false);
    // Везём ли мы звук вместе с картинкой (человек отметил «Поделиться
    // звуком») и идёт ли звук чужой демонстрации прямо сейчас.
    const [shareAudio, setShareAudio] = useState(false);
    const [screenAudioIn, setScreenAudioIn] = useState(false);
    // «Не слышу вас», громкость чужой демонстрации, личная громкость
    // участника (карточка по правой кнопке / долгому тапу) и показ
    // демонстрации во весь экран.
    const [deafened, setDeafened] = useState(false);
    const [screenVol, setScreenVol] = useState(100);
    const [peerVol, setPeerVol] = useState(null);   // { id, name, vol }
    const [theater, setTheater] = useState(false);
    // Кто ведёт демонстрацию экрана (id участника, может быть свой) — одна
    // на комнату, закрепляется сервером.
    const [screenId, setScreenId] = useState(null);
    const [screenFrames, setScreenFrames] = useState(() => new Set());
    // Закреплённый участник: его камера — во весь стейдж (клик по плитке),
    // важнее демонстрации. Локальная настройка, на других не влияет.
    const [pinnedId, setPinnedId] = useState(null);
    const [ping, setPing] = useState(null);
    const [notice, setNotice] = useState("");
    const [lightbox, setLightbox] = useState(null);
    const [tab, setTab] = useState("chat");
    const [panelOpen, setPanelOpen] = useState(false);
    const [isMobile, setIsMobile] = useState(false);
    const [page, setPage] = useState(0);
    const [hasFrame, setHasFrame] = useState(() => new Set());
    const [speaking, setSpeaking] = useState(() => new Set());
    const [shareOpen, setShareOpen] = useState(false);
    const [copied, setCopied] = useState(false);
    const [elapsed, setElapsed] = useState("00:00");
    const [reconnecting, setReconnecting] = useState(false);

    const msgRef = useRef(null);
    const selfVideoRef = useRef(null);
    const stageSelfRef = useRef(null);      // превью собственной демонстрации на сцене
    const stagePinSelfRef = useRef(null);   // своя камера на сцене (закрепление себя)
    const fileRef = useRef(null);           // скрытый <input type=file> для картинок чата
    const touchX = useRef(null);
    const holdRef = useRef(null);           // долгий тап по плитке = правая кнопка

    // Зеркало актуального состояния для обработчиков вне рендера
    // (наполняется эффектом ниже по файлу, после вычисления pages).
    const stateRef = useRef({});

    // Имя участника (подтверждается на гейте или берётся из sessionStorage).
    const nameRef = useRef(savedName);

    // ---- Сеть и медиа (императивная часть, живёт в ref) ----
    const mediaRef = useRef(null);
    if (mediaRef.current === null) {
      const av = loadAvSettings();
      mediaRef.current = {
        ws: null, myId: null, manualClose: false, fatal: false, attempts: 0,
        roomPass: "", waitTimer: null, noticeTimer: null,
        camStream: null, micStream: null, displayStream: null,
        // Состояние тумблеров вне React: joinMsg вызывается из обработчика
        // сокета, где свежего состояния из useState ещё нет.
        mic: true, cam: true,
        speakingUntil: new Map(), chatChain: Promise.resolve(),
        mediaStarted: false, joinedAt: 0, profile: null,
        // pref — выбранные устройства и гейны из localStorage.
        pref: av,
        // Медиадвижок (кодеки, приём, E2E) и ключ шифрования — только на клиенте.
        engine: null, e2eKey: null,
      };
    }
    const M = mediaRef.current;

    // ---- Настройки: устройства и звук ----
    const [settingsOpen, setSettingsOpen] = useState(false);
    // Раздел настроек. На телефоне тот же список работает как «список →
    // раздел → назад», поэтому нужен ещё и признак «раздел открыт».
    const [section, setSection] = useState("audio");
    const [onSection, setOnSection] = useState(false);
    const [devices, setDevices] = useState({ mics: [], cams: [], outs: [] });
    const [micId, setMicId] = useState(M.pref.micId);
    const [camId, setCamId] = useState(M.pref.camId);
    const [outId, setOutId] = useState(M.pref.outId);
    const [volume, setVolume] = useState(M.pref.volume);
    const [sens, setSens] = useState(M.pref.sens);
    const [micLevel, setMicLevel] = useState(0);
    const [quality, setQuality] = useState(
      { cam: M.pref.qCam, screen: M.pref.qScreen, audio: M.pref.qAudio });
    // Обработка голоса — браузерная: она стоит ДО нашего захвата, в worklet
    // приходит уже очищенный трек. Своего шумодава не тащим (это был бы
    // WASM на пару мегабайт ради того, что уже есть).
    const [proc, setProc] = useState(
      { noise: M.pref.noise, echo: M.pref.echo, agc: M.pref.agc });
    // Интерфейс
    const [mirror, setMirror] = useState(M.pref.mirror);
    const [perPagePref, setPerPagePref] = useState(String(M.pref.perPage));
    const [hideNoVideo, setHideNoVideo] = useState(M.pref.hideNoVideo);
    const [showSelf, setShowSelf] = useState(M.pref.showSelf);
    // Живые показатели — тикают только пока открыт раздел «Диагностика».
    const [diag, setDiag] = useState(null);
    // Что браузер умеет декодировать — узнаём один раз, когда открыли
    // раздел «О программе»: проба поднимает декодеры и на слабой машине
    // стоит десятки миллисекунд.
    const [decodeOk, setDecodeOk] = useState(null);

    // ---- E2E-шифрование ----
    const [lockedIds, setLockedIds] = useState(() => new Set());
    const [e2eOn, setE2eOn] = useState(false);
    const [e2ePhrase, setE2ePhrase] = useState("");
    const [e2eBusy, setE2eBusy] = useState(false);

    // Движок создаётся один раз; колбэки замыкают только стабильные ссылки
    // (setState, ref-ы, function-декларации), пересоздание на рендерах не нужно.
    if (!M.engine) {
      M.engine = MeetUpMedia.create({
        send: (buf) => { if (M.ws && M.ws.readyState === 1) M.ws.send(buf); },
        buffered: () => (M.ws ? M.ws.bufferedAmount : 0),
        micOn: () => !!stateRef.current.mic,
        onSelfSpeaking: () => { if (M.myId != null) markSpeaking(M.myId); },
        onSpeaking: (id) => markSpeaking(id),
        onFrameActivity: (id) => {
          if (!hasFrameRef.current.has(id))
            setHasFrame(prev => { const n = new Set(prev); n.add(id); return n; });
        },
        onScreenFrame: (id) => {
          if (!screenFramesRef.current.has(id))
            setScreenFrames(prev => { const n = new Set(prev); n.add(id); return n; });
        },
        onLocked: (id, locked) => {
          setLockedIds(prev => {
            if (prev.has(id) === locked) return prev;
            const n = new Set(prev);
            if (locked) n.add(id); else n.delete(id);
            return n;
          });
        },
        // Пришёл звук чужой демонстрации. Ставим флаг один раз, снимает его
        // сторож ниже: пакеты идут потоком, а состояние меняется дважды.
        onScreenAudio: () => {
          if (!screenAudioInRef.current) setScreenAudioIn(true);
        },
        // Кто-то в комнате не разобрал наше видео. Молчать нельзя: у него
        // пусто, у нас всё хорошо, и без этой строки ни одна сторона не
        // поймёт, почему.
        onCodecComplaint: (info) => {
          const where = info.isScreen ? "Демонстрация" : "Камера";
          showNotice(info.switched
            ? where + ": участник не понимает " + info.codec + " — перешли на H.264."
            : where + ": участник не может показать ваше видео (" + info.codec + ").");
        },
      });
    }
    const engine = M.engine;

    useEffect(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);
    const toggleTheme = () => setTheme(t => (t === "dark" ? "light" : "dark"));

    useEffect(() => { if (roomTitle) document.title = roomTitle + " — MeetUp"; }, [roomTitle]);

    // ================= Подключение =================

    function openSocket() {
      const ws = new WebSocket(MeetUp.wsUrl());
      ws.binaryType = "arraybuffer";
      M.ws = ws;
      ws.onopen = () => ws.send(JSON.stringify(joinMsg()));
      ws.onmessage = onWsMessage;
      ws.onclose = onWsClose;
    }

    // Пароль нужен только личной комнате — для остальных сервер его игнорирует.
    //
    // mic/cam шлём прямо в join, и это не мелочь: сервер до сих пор рассылал
    // остальным своё умолчание (оба включены) РАНЬШЕ, чем долетал наш первый
    // state, и собеседники видели у вошедшего «камера подключается», которой
    // нет. Старый сервер лишние поля просто игнорирует.
    function joinMsg() {
      return { type: "join", room: roomCode, name: nameRef.current, password: M.roomPass,
               mic: !!M.mic, cam: !!M.cam };
    }

    // Повторный join: по живому сокету сервер разрешает ещё одну попытку
    // (неверный пароль, комната ещё не открыта), сокет переоткрывать не надо.
    function sendJoin() {
      if (M.ws && M.ws.readyState === 1) M.ws.send(JSON.stringify(joinMsg()));
      else openSocket();
    }

    function fatal(text) {
      M.fatal = true;
      try { if (M.ws) M.ws.close(); } catch (e) {}
      setErrText(text);
      setPhase("error");
    }

    function onWsClose() {
      if (M.manualClose || M.fatal) return;
      M.attempts += 1;
      if (M.attempts > 8) {
        fatal("Соединение с сервером потеряно. Проверьте сеть и попробуйте ещё раз.");
        return;
      }
      setReconnecting(true);
      setTimeout(() => {
        if (!M.manualClose && !M.fatal) openSocket();
      }, Math.min(M.attempts, 4) * 1500);
    }

    function onWsMessage(event) {
      if (typeof event.data === "string") onJson(JSON.parse(event.data));
      else engine.onBinary(event.data);
    }

    // Тело сообщения чата: текст и/или картинка, расшифровка "🔒e2e:..." при
    // наличии ключа. raw/rawImage хранятся, чтобы перечитать сообщение, когда
    // пользователь введёт ключ позже.
    async function renderChatBody(rawText, rawImage, imageDropped) {
      const out = { raw: typeof rawText === "string" ? rawText : "",
                    rawImage: typeof rawImage === "string" ? rawImage : "",
                    text: "", locked: false,
                    image: null, imageLocked: false, imageDropped: !!imageDropped };
      if (out.raw) {
        const res = await engine.openText(out.raw);
        if (!res.encrypted) out.text = out.raw;
        else if (res.text != null) out.text = res.text;
        else { out.text = "Зашифрованное сообщение — нужен ключ"; out.locked = true; }
      }
      if (out.rawImage) {
        const img = await engine.openImage(out.rawImage);
        if (img.src) out.image = img.src;
        else out.imageLocked = true;
      }
      return out;
    }

    function onJson(msg) {
      switch (msg.type) {
        case "join_ok": {
          M.myId = msg.sender_id;
          M.attempts = 0;
          if (M.waitTimer) { clearTimeout(M.waitTimer); M.waitTimer = null; }
          if (msg.room_title) setRoomTitle(msg.room_title);
          if (!M.joinedAt) {
            M.joinedAt = Date.now();
            recordVisit(roomCode, msg.room_title);   // история комнат на главной (не реконнект)
          }
          setMyId(msg.sender_id);
          setReconnecting(false);
          setPhase("live");
          setPeers((msg.participants || []).map(p => ({
            id: p.id, name: p.name, mic: p.mic !== false, cam: p.cam !== false,
            userId: p.user_id || 0, avatar: p.avatar || 0,
          })));
          // История чата: новый участник видит разговор, который шёл до него
          // (зашифрованные сообщения читаются при наличии ключа).
          Promise.all((msg.history || []).map(async (h, i) => ({
            key: "h" + i + "-" + h.timestamp_ms,
            author: h.sender_name || ("Участник " + h.sender_id),
            time: fmtTime(h.timestamp_ms),
            self: h.sender_id === msg.sender_id,
            ...(await renderChatBody(h.text, h.image, h.image_dropped)),
          }))).then(setMessages);
          setScreenId(msg.screen_id != null ? msg.screen_id : null);
          setScreenFrames(new Set());
          engine.clearPeers();
          engine.requestKeyframe();   // просим у вещающих опорные кадры
          pushState(stateRef.current.mic, stateRef.current.cam);
          // Первый замер пинга сразу, дальше — по таймеру раз в 4 с.
          if (M.ws && M.ws.readyState === 1)
            M.ws.send(JSON.stringify({ type: "ping", t: Date.now() }));
          // Реконнект посреди своей демонстрации: слот на сервере освободился
          // при обрыве — просим закрепить его за нами снова.
          if (M.displayStream && M.ws && M.ws.readyState === 1)
            M.ws.send(JSON.stringify({ type: "screen", on: true }));
          if (!M.mediaStarted) { M.mediaStarted = true; startMedia(); }
          break;
        }
        case "participant_joined":
          setPeers(prev => prev.some(p => p.id === msg.id) ? prev : [...prev, {
            id: msg.id, name: msg.name, mic: msg.mic !== false, cam: msg.cam !== false,
            userId: msg.user_id || 0, avatar: msg.avatar || 0,
          }]);
          engine.forceKeyframe();   // новичку нужен опорный кадр, не ждать 3 с
          break;
        case "participant_left":
          setPeers(prev => prev.filter(p => p.id !== msg.id));
          engine.dropPeer(msg.id);
          M.speakingUntil.delete(msg.id);
          dropFromSet(setHasFrame, msg.id);
          dropFromSet(setLockedIds, msg.id);
          dropFromSet(setScreenFrames, msg.id);
          setScreenId(cur => (cur === msg.id ? null : cur));
          setPinnedId(cur => (cur === msg.id ? null : cur));
          break;
        case "pong":
          setPing(Math.max(0, Date.now() - Number(msg.t)));
          break;
        case "screen":
          // Сервер закрепил/освободил демонстрацию. Своё подтверждение —
          // сигнал начать слать кадры экрана.
          if (msg.on) {
            setScreenId(msg.id);
            setPinnedId(null);   // новая демонстрация выходит на сцену
            if (msg.id === M.myId && M.displayStream) {
              engine.startScreen(M.displayStream);
              // Звук — той же командой: если человек отметил «Поделиться
              // звуком», в потоке есть дорожка, и она поедет отдельной полосой.
              engine.startScreenAudio(M.displayStream).then((ok) => setShareAudio(!!ok));
              setSharing(true);
            }
          } else {
            setScreenId(cur => (cur === msg.id ? null : cur));
            dropFromSet(setScreenFrames, msg.id);
            if (msg.id === M.myId && stateRef.current.sharing) stopSharing(false);
          }
          break;
        case "participant_state":
          setPeers(prev => prev.map(p => p.id === msg.id ? { ...p, mic: !!msg.mic, cam: !!msg.cam } : p));
          if (!msg.cam) {
            engine.lastFrameAt.delete(msg.id);
            dropFromSet(setHasFrame, msg.id);
          }
          break;
        case "chat": {
          const self = msg.sender_id === M.myId;
          // Расшифровка асинхронная — цепочка сохраняет порядок сообщений.
          M.chatChain = M.chatChain.then(async () => {
            const body = await renderChatBody(msg.text, msg.image, false);
            setMessages(prev => [...prev, {
              key: msg.timestamp_ms + "-" + msg.sender_id + "-" + prev.length,
              author: msg.sender_name || ("Участник " + msg.sender_id),
              time: fmtTime(msg.timestamp_ms),
              self,
              ...body,
            }]);
          });
          const s = stateRef.current;
          const chatVisible = s.isMobile ? (s.panelOpen && s.tab === "chat") : s.tab === "chat";
          if (!self && !chatVisible) setUnread(u => u + 1);
          break;
        }
        case "error":
          if (msg.reason === "room_not_found") {
            M.manualClose = true;
            fatal("Комната не найдена или уже закрыта. Проверьте ссылку либо создайте новую комнату в лобби.");
          } else if (msg.reason === "session_replaced") {
            // Тот же аккаунт вошёл в комнату ещё раз — работает новое
            // подключение, это останавливаем (без реконнекта, иначе
            // два окна выбивали бы друг друга по кругу).
            M.manualClose = true;
            stopEverything();
            fatal("Вы подключились к этой комнате в другом окне или на другом устройстве. Здесь соединение остановлено.");
          } else if (msg.reason === "room_closed") {
            // Владелец завершил конференцию с главной — расходимся без
            // реконнекта.
            M.manualClose = true;
            stopEverything();
            fatal("Владелец завершил конференцию.");
          } else if (msg.reason === "wrong_password") {
            // Личная комната с паролем: спрашиваем (или переспрашиваем) на гейте.
            setNeedPass(true);
            setGateErr(M.roomPass ? "Неверный пароль. Попробуйте ещё раз." : "");
            M.roomPass = "";
            setGatePass("");
            setPhase("gate");
          } else if (msg.reason === "alias_forbidden") {
            // Ссылка-приглашение с фиксированным списком логинов: этот
            // аккаунт (или аноним) в него не входит.
            M.manualClose = true;
            stopEverything();
            fatal("Эта ссылка-приглашение доступна только определённым участникам. Войдите в аккаунт, которому открыт доступ.");
          } else if (msg.reason === "screen_busy") {
            // Демонстрацию уже ведёт другой: освобождаем захваченный экран.
            if (!stateRef.current.sharing) stopSharing(false);
            showNotice("Демонстрацию экрана уже ведёт другой участник.");
          } else if (msg.reason === "image_too_large") {
            showNotice("Изображение слишком большое для отправки.");
          } else if (msg.reason === "room_offline") {
            // Личная комната без владельца не существует: ждём, пока владелец
            // её откроет, и пробуем снова — гость войдёт сам.
            setPhase("waiting");
            if (!M.waitTimer)
              M.waitTimer = setTimeout(() => {
                M.waitTimer = null;
                if (M.ws && M.ws.readyState === 1) sendJoin();
              }, 5000);
          } else {
            console.warn("Ошибка сервера:", msg.reason);
          }
          break;
      }
    }

    function pushState(micVal, camVal) {
      // Зеркало для joinMsg: реконнект посреди звонка должен представиться с
      // тем состоянием, которое есть на самом деле, а не со стартовым.
      M.mic = micVal; M.cam = camVal;
      if (M.ws && M.ws.readyState === 1)
        M.ws.send(JSON.stringify({ type: "state", mic: micVal, cam: camVal }));
    }

    // Короткое уведомление над доком; само гаснет.
    function showNotice(text) {
      setNotice(text);
      clearTimeout(M.noticeTimer);
      M.noticeTimer = setTimeout(() => setNotice(""), 4000);
    }

    // Убрать id из Set-состояния (hasFrame, lockedIds), не трогая лишний рендер.
    function dropFromSet(setter, id) {
      setter(prev => {
        if (!prev.has(id)) return prev;
        const n = new Set(prev); n.delete(id); return n;
      });
    }

    // ================= Приём медиа =================
    // Кадры и звук разбирает движок (assets/meetup-media.js) — страница
    // получает события: активность кадров, «говорит», «зашифровано».

    const hasFrameRef = useRef(hasFrame);
    useEffect(() => { hasFrameRef.current = hasFrame; }, [hasFrame]);

    const screenFramesRef = useRef(screenFrames);
    useEffect(() => { screenFramesRef.current = screenFrames; }, [screenFrames]);

    const screenAudioInRef = useRef(screenAudioIn);
    useEffect(() => { screenAudioInRef.current = screenAudioIn; }, [screenAudioIn]);

    const messagesRef = useRef(messages);
    useEffect(() => { messagesRef.current = messages; }, [messages]);

    function markSpeaking(id) {
      M.speakingUntil.set(id, Date.now() + 450);
    }

    // ================= Захват медиа =================

    async function startMedia() {
      await engine.ensureAudio();
      engine.setVolume(M.pref.volume / 100);
      engine.setSensitivity(M.pref.sens / 100);
      engine.setQuality("cam", M.pref.qCam);
      engine.setQuality("screen", M.pref.qScreen);
      engine.setQuality("audio", M.pref.qAudio);
      if (M.pref.outId) engine.setSinkId(M.pref.outId);
      await startMic();
      await startCamera();
    }

    // getUserMedia с выбранным устройством; если оно пропало — системное.
    // Разрешение камеры следует выбранному качеству отправки.
    function mediaConstraints(kind, id) {
      const base = kind === "audio"
        ? { echoCancellation: M.pref.echo, noiseSuppression: M.pref.noise,
            autoGainControl: M.pref.agc }
        : { ...CAM_RES[M.pref.qCam] };
      if (id) base.deviceId = { exact: id };
      return { [kind]: base };
    }

    async function grabStream(kind, id) {
      try {
        return await navigator.mediaDevices.getUserMedia(mediaConstraints(kind, id));
      } catch (e) {
        if (!id) throw e;
        return navigator.mediaDevices.getUserMedia(mediaConstraints(kind, ""));
      }
    }

    async function startMic() {
      if (!M.micStream) {
        try {
          M.micStream = await grabStream("audio", M.pref.micId);
        } catch (e) {
          setMic(false);
          pushState(false, stateRef.current.cam);
          return false;
        }
      }
      await engine.startMic(M.micStream);
      return true;
    }

    async function startCamera() {
      if (!M.camStream) {
        try {
          M.camStream = await grabStream("video", M.pref.camId);
        } catch (e) {
          setCam(false);
          pushState(stateRef.current.mic, false);
          return false;
        }
      }
      engine.startVideo(M.camStream);
      return true;
    }

    // ================= Кнопки дока =================

    // byUser=false — микрофон дёргает не человек, а toggleSound(): тогда мы
    // помним, что вернуть, и не считаем это его собственным решением.
    async function toggleMic(byUser) {
      const next = !stateRef.current.mic;
      if (next && !M.micStream) {
        // Разрешения не было — пробуем запросить ещё раз.
        const ok = await startMic();
        if (!ok) return;
      }
      if (M.micStream) M.micStream.getAudioTracks().forEach(t => { t.enabled = next; });
      // Человек тронул микрофон сам — восстанавливать за него больше нечего.
      if (byUser !== false) M.micBeforeDeafen = false;
      setMic(next);
      pushState(next, stateRef.current.cam);
    }

    // «Не слышу вас» почти всегда значит и «не говорю»: выключая звук
    // конференции, снимаем и микрофон, а возвращая — включаем обратно, но
    // только если человек не распорядился им сам. Само по себе включение
    // звука микрофон не включает никогда.
    //
    // Глушим только выход движка: декодеры и джиттер-буферы продолжают
    // работать, поэтому ни картинка (её придерживают по часам звука), ни
    // подсветка «говорит» не встают. Состояние не запоминаем между входами —
    // заходить в комнату оглохшим никто не хочет.
    function toggleSound() {
      const next = !deafened;
      setDeafened(next);
      engine.setDeafened(next);
      if (next) {
        const had = stateRef.current.mic;
        if (had) toggleMic(false);
        M.micBeforeDeafen = had;
      } else {
        if (M.micBeforeDeafen && !stateRef.current.mic) toggleMic(false);
        M.micBeforeDeafen = false;
      }
    }

    async function toggleCamera() {
      const s = stateRef.current;
      const next = !s.cam;
      if (next) {
        if (!M.camStream) {
          const ok = await startCamera();
          if (!ok) return;
        } else {
          engine.startVideo(M.camStream);
        }
      } else if (M.camStream) {
        // Останавливаем дорожки, а не просто глушим — гаснет индикатор камеры.
        M.camStream.getTracks().forEach(t => t.stop());
        M.camStream = null;
        engine.stopVideo();
      }
      setCam(next);
      pushState(s.mic, next);
    }

    // Демонстрация экрана идёт отдельным потоком, камеру не трогает.
    // В комнате может быть только одна: сначала захватываем экран, потом
    // просим сервер закрепить его за нами — кадры пойдут после подтверждения
    // (сообщение "screen" в onJson), при отказе придёт error screen_busy.
    async function toggleShare() {
      const s = stateRef.current;
      if (s.sharing) { stopSharing(true); return; }
      if (s.screenId != null) {
        showNotice("Демонстрацию экрана уже ведёт другой участник.");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return;
      let stream;
      try {
        // audio: true — просим ещё и звук показываемого. Chrome и Edge на этом
        // рисуют в своём окне выбора галочку «Поделиться звуком»; Firefox и
        // Safari её не покажут и просто вернут поток без звуковой дорожки —
        // отдельной проверки браузера не нужно, достаточно посмотреть, что
        // приехало. Своей настройки не заводим: галочка в системном окне и
        // есть согласие человека.
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      } catch (e) {
        return;   // пользователь отменил выбор
      }
      M.displayStream = stream;
      const track = stream.getVideoTracks()[0];
      if (track) track.onended = () => stopSharing(true);   // «Прекратить доступ»
      // Звуковую дорожку человек может закрыть отдельно от картинки. Сам
      // кодер поднимется по подтверждению слота (case "screen"), как и видео:
      // до подтверждения сервер наши кадры всё равно выбрасывает.
      const atrack = stream.getAudioTracks()[0];
      if (atrack) atrack.onended = () => { engine.stopScreenAudio(); setShareAudio(false); };
      setShareAudio(false);
      if (M.ws && M.ws.readyState === 1)
        M.ws.send(JSON.stringify({ type: "screen", on: true }));
      else
        stopSharing(false);
    }

    function stopSharing(notifyServer) {
      if (M.displayStream) {
        M.displayStream.getTracks().forEach(t => t.stop());
        M.displayStream = null;
      }
      engine.stopScreen();      // гасит и звук демонстрации
      setSharing(false);
      setShareAudio(false);
      // Локально гасим сцену сразу; остальным сервер разошлёт "screen off".
      setScreenId(cur => (cur === M.myId ? null : cur));
      if (notifyServer && M.ws && M.ws.readyState === 1)
        M.ws.send(JSON.stringify({ type: "screen", on: false }));
    }

    function stopEverything() {
      engine.stop();
      [M.camStream, M.micStream, M.displayStream].forEach(st => {
        if (st) st.getTracks().forEach(t => t.stop());
      });
    }

    // Куда уводить из конференции: авторизованного — на главную, анонима — в лобби.
    const exitHref = isAccount ? "home.html" : "anon_lobby.html";
    const exitLabel = isAccount ? "На главную" : "В лобби";

    function leave() {
      M.manualClose = true;
      try { if (M.ws) M.ws.close(); } catch (e) {}
      stopEverything();
      location.href = exitHref;
    }

    // ================= Настройки =================

    async function refreshDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      let list = [];
      try { list = await navigator.mediaDevices.enumerateDevices(); } catch (e) { return; }
      const mics = [], cams = [], outs = [];
      for (const d of list) {
        // Без разрешения на медиа label пустой — подписываем по номеру.
        if (d.kind === "audioinput") mics.push({ id: d.deviceId, label: d.label || ("Микрофон " + (mics.length + 1)) });
        else if (d.kind === "videoinput") cams.push({ id: d.deviceId, label: d.label || ("Камера " + (cams.length + 1)) });
        else if (d.kind === "audiooutput") outs.push({ id: d.deviceId, label: d.label || ("Динамики " + (outs.length + 1)) });
      }
      setDevices({ mics, cams, outs });
    }

    function openSettings() {
      refreshDevices();
      setSettingsOpen(true);
      // На телефоне открываем список разделов, а не тот, где были в прошлый
      // раз: на широком экране рельс виден всегда и такой памяти не мешает.
      setOnSection(!isMobile);
    }

    async function selectMic(id) {
      setMicId(id);
      M.pref.micId = id;
      saveAvSettings({ micId: id });
      if (!M.micStream) return;   // микрофон не захвачен — применится при включении
      let stream;
      try { stream = await grabStream("audio", id); } catch (e) { refreshDevices(); return; }
      M.micStream.getTracks().forEach(t => t.stop());
      M.micStream = stream;
      stream.getAudioTracks().forEach(t => { t.enabled = stateRef.current.mic; });
      await engine.startMic(stream);
    }

    async function selectCam(id) {
      setCamId(id);
      M.pref.camId = id;
      saveAvSettings({ camId: id });
      if (!M.camStream) return;   // камера выключена — применится при включении
      let stream;
      try { stream = await grabStream("video", id); } catch (e) { refreshDevices(); return; }
      M.camStream.getTracks().forEach(t => t.stop());
      M.camStream = stream;
      if (stateRef.current.cam) engine.startVideo(stream);
    }

    function selectOut(id) {
      setOutId(id);
      M.pref.outId = id;
      saveAvSettings({ outId: id });
      engine.setSinkId(id);
    }

    function changeVolume(v) {
      setVolume(v);
      saveAvSettings({ volume: v });
      engine.setVolume(v / 100);
    }

    function changeSens(v) {
      setSens(v);
      saveAvSettings({ sens: v });
      engine.setSensitivity(v / 100);
    }

    // Обработка голоса. Меняем на живом треке: браузер умеет применять эти
    // ограничения на лету, и перезахват микрофона (с миганием индикатора и
    // паузой в разговоре) ради тумблера был бы неоправдан.
    async function toggleProc(key) {
      const next = { ...proc, [key]: !proc[key] };
      setProc(next);
      M.pref[key] = next[key];
      saveAvSettings({ [key]: next[key] });
      const track = M.micStream && M.micStream.getAudioTracks()[0];
      if (!track || !track.applyConstraints) return;
      try {
        await track.applyConstraints({ noiseSuppression: next.noise,
                                       echoCancellation: next.echo,
                                       autoGainControl: next.agc });
      } catch (e) {
        // Не дал сменить на лету — применится при следующем захвате.
      }
    }

    function setPref(key, value, apply) {
      M.pref[key] = value;
      saveAvSettings({ [key]: value });
      if (apply) apply(value);
    }

    // Заполненная часть ползунка. accent-color в Chrome даёт грязный трек на
    // светлой теме, поэтому рисуем градиентом от значения.
    function rangeFill(v, max) {
      const p = Math.round((v / max) * 100);
      return "linear-gradient(90deg, var(--accent) " + p + "%, var(--surface-3) " + p + "%)";
    }

    // ---- Громкость чужой демонстрации ----
    // Ручка у слушателя, а не у ведущего: иначе один человек решал бы за всю
    // комнату, насколько громко играет его фонограмма. Между комнатами не
    // запоминается — у каждой демонстрации свой звук.
    function applyScreenVol(v) {
      setScreenVol(v);
      engine.setScreenVolume(v / 100);
    }
    function changeScreenVol(v) {
      if (v > 0) M.screenVolBack = v;   // куда возвращаться из «тихо»
      applyScreenVol(v);
    }
    function toggleScreenMute() {
      applyScreenVol(screenVol > 0 ? 0 : (M.screenVolBack || 100));
    }

    // ---- Личная громкость участника ----
    // Один говорит шёпотом, другой кричит — общая громкость тут не помогает.
    // Помним и для тех, кто сейчас молчит: движок применит при первом звуке.
    function changePeerVol(id, v) {
      engine.setPeerVolume(id, v / 100);
      setPeerVol(cur => (cur && cur.id === id ? { ...cur, vol: v } : cur));
    }

    // ---- Демонстрация во весь экран ----
    // Свой режим (CSS) — основной, полноэкранный API просим дополнительно:
    // на iOS его для произвольных элементов нет, и без своего режима кнопка
    // там просто не работала бы.
    function toggleTheater() {
      const next = !theater;
      setTheater(next);
      try {
        if (next) {
          const el = document.documentElement;
          if (el.requestFullscreen) { const p = el.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
        } else if (document.fullscreenElement && document.exitFullscreen) {
          const p = document.exitFullscreen(); if (p && p.catch) p.catch(() => {});
        }
      } catch (e) { /* браузер не дал — остаёмся в своём режиме */ }
    }

    // Качество отправки: битрейт применяет движок на лету; смена качества
    // камеры дополнительно перезахватывает её с новым разрешением.
    async function selectQuality(kind, level) {
      setQuality(q => ({ ...q, [kind]: level }));
      const prefKey = kind === "cam" ? "qCam" : kind === "screen" ? "qScreen" : "qAudio";
      M.pref[prefKey] = level;
      saveAvSettings({ [prefKey]: level });
      engine.setQuality(kind, level);
      if (kind !== "cam" || !M.camStream) return;
      let stream;
      try { stream = await grabStream("video", M.pref.camId); } catch (e) { return; }
      M.camStream.getTracks().forEach(t => t.stop());
      M.camStream = stream;
      if (stateRef.current.cam) engine.startVideo(stream);
    }

    // ================= E2E-шифрование =================

    // Единая точка включения/выключения: ключ в движок, секрет в sessionStorage,
    // уже полученный чат — перечитать с новым ключом.
    async function applyE2eKey(key, secretToStore, phraseForUi) {
      M.e2eKey = key;
      engine.setKey(key);
      saveE2eSecret(key ? secretToStore : "");
      setE2eOn(!!key);
      setE2ePhrase(phraseForUi || "");
      M.chatChain = M.chatChain.then(async () => {
        const updated = await Promise.all(
          messagesRef.current.map(async (m) =>
            ({ ...m, ...(await renderChatBody(m.raw, m.rawImage, m.imageDropped)) })));
        setMessages(updated);
      });
    }

    // Восстановление ключа при загрузке: #k= из ссылки важнее сохранённого.
    async function applySavedE2e() {
      try {
        const fromHash = location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/);
        if (fromHash) {
          await applyE2eKey(await MeetUpMedia.importKeyB64(fromHash[1]), "k:" + fromHash[1], "");
          return;
        }
        const saved = loadE2eSecret();
        if (saved.startsWith("k:"))
          await applyE2eKey(await MeetUpMedia.importKeyB64(saved.slice(2)), saved, "");
        else if (saved.startsWith("p:"))
          await applyE2eKey(await MeetUpMedia.deriveKeyFromPhrase(saved.slice(2), roomCode),
                            saved, saved.slice(2));
      } catch (e) { /* битый ключ в ссылке или хранилище — просто без E2E */ }
    }

    async function applyPhrase() {
      const phrase = e2ePhrase.trim();
      setE2eBusy(true);
      try {
        if (!phrase) await applyE2eKey(null, "", "");
        else await applyE2eKey(await MeetUpMedia.deriveKeyFromPhrase(phrase, roomCode),
                               "p:" + phrase, phrase);
      } finally {
        setE2eBusy(false);
      }
    }

    async function disableE2e() {
      await applyE2eKey(null, "", "");
    }

    // Ссылка-приглашение с ключом: ключ уезжает во fragment (#k=…) —
    // эта часть адреса на сервер не отправляется.
    async function copyKeyInvite() {
      if (!M.e2eKey) return;
      const url = inviteUrl + "#k=" + (await MeetUpMedia.exportKeyB64(M.e2eKey));
      const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
      if (navigator.clipboard && window.isSecureContext)
        navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done));
      else
        fallbackCopy(url, done);
    }

    // ================= Чат =================

    function sendChat() {
      const text = draft.trim();
      if (!text || !M.ws || M.ws.readyState !== 1) return;
      setDraft("");
      if (engine.encrypted()) {
        // Сервер хранит и ретранслирует шифротекст — прочитают только с ключом.
        engine.sealText(text).then(sealed => {
          if (sealed && M.ws && M.ws.readyState === 1)
            M.ws.send(JSON.stringify({ type: "chat", text: sealed }));
        });
      } else {
        M.ws.send(JSON.stringify({ type: "chat", text }));
      }
    }

    // ---- Картинки в чате: пережим в JPEG под лимит сервера, E2E как у текста ----

    async function loadBitmap(file) {
      try {
        return await createImageBitmap(file);
      } catch (e) {
        // Формат не понял createImageBitmap — пробуем через <img>.
        const url = URL.createObjectURL(file);
        try {
          const img = new Image();
          await new Promise((ok, err) => { img.onload = ok; img.onerror = err; img.src = url; });
          return img;
        } finally {
          URL.revokeObjectURL(url);
        }
      }
    }

    async function fileToJpegB64(file) {
      const bmp = await loadBitmap(file);
      const srcW = bmp.width || bmp.naturalWidth, srcH = bmp.height || bmp.naturalHeight;
      if (!srcW || !srcH) throw new Error("empty image");
      const c = document.createElement("canvas");
      try {
        // Уменьшаем и снижаем качество, пока не влезет в лимит сервера.
        for (const maxDim of [1600, 1024, 720]) {
          const k = Math.min(1, maxDim / Math.max(srcW, srcH));
          c.width = Math.max(1, Math.round(srcW * k));
          c.height = Math.max(1, Math.round(srcH * k));
          const g = c.getContext("2d");
          g.fillStyle = "#fff";                    // прозрачность → белый фон
          g.fillRect(0, 0, c.width, c.height);
          g.drawImage(bmp, 0, 0, c.width, c.height);
          for (const q of [0.85, 0.7, 0.55]) {
            const dataUrl = c.toDataURL("image/jpeg", q);
            const b64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
            if (b64.length <= 480000) return b64;
          }
        }
      } finally {
        if (bmp.close) bmp.close();
      }
      throw new Error("too big");
    }

    async function sendImage(file) {
      if (!file || !M.ws || M.ws.readyState !== 1) return;
      let image;
      try {
        image = await fileToJpegB64(file);
      } catch (e) {
        showNotice("Не получилось подготовить изображение.");
        return;
      }
      if (engine.encrypted()) {
        image = await engine.sealImage(image);
        if (!image) return;
      }
      if (M.ws && M.ws.readyState === 1)
        M.ws.send(JSON.stringify({ type: "chat", image }));
    }

    function onPickImage(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";   // повторный выбор того же файла снова даст change
      if (f) sendImage(f);
    }

    // Вставка скриншота из буфера обмена прямо в поле сообщения.
    function onComposerPaste(e) {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const it of items) {
        if (it.type && it.type.startsWith("image/")) {
          const f = it.getAsFile();
          if (f) { e.preventDefault(); sendImage(f); }
          return;
        }
      }
    }

    useEffect(() => {
      if (msgRef.current) msgRef.current.scrollTop = msgRef.current.scrollHeight;
    }, [messages, tab, panelOpen]);

    // Сбрасываем счётчик непрочитанного, когда чат на виду.
    useEffect(() => {
      const chatVisible = isMobile ? (panelOpen && tab === "chat") : tab === "chat";
      if (chatVisible) setUnread(0);
    }, [messages, tab, panelOpen, isMobile]);

    // ================= Гейт (вход по ссылке: имя и/или пароль) =================

    function gateSubmit() {
      const name = nameRef.current || gateName.trim();
      if (!name || (needPass && !gatePass)) return;
      if (!nameRef.current) {
        MeetUp.saveName(name);
        nameRef.current = name;
      }
      M.roomPass = gatePass;
      setGateErr("");
      setPhase("connecting");
      sendJoin();
    }

    // ================= Ссылка-приглашение =================

    const inviteUrl = location.origin + location.pathname + "?room=" + encodeURIComponent(roomCode);

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }

    // Общая копия в буфер: clipboard-API в защищённом контексте, иначе
    // старый приём через скрытое поле (http-развёртывание без TLS).
    function copyText(text) {
      const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
      if (navigator.clipboard && window.isSecureContext)
        navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
      else
        fallbackCopy(text, done);
    }

    function copyInvite() {
      const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
      if (navigator.clipboard && window.isSecureContext)
        navigator.clipboard.writeText(inviteUrl).then(done, () => fallbackCopy(inviteUrl, done));
      else
        fallbackCopy(inviteUrl, done);
    }

    function openShare() {
      setShareOpen(true);
      copyInvite();   // показываем и сразу копируем в буфер
    }

    // ================= Эффекты монтирования =================

    useEffect(() => {
      if (!roomCode) { location.replace("anon_lobby.html"); return; }

      // Личная комната рассказывает о себе до входа: название — в шапку и на
      // экран ожидания, has_password — чтобы гейт сразу спросил пароль.
      MeetUp.api("GET", "/api/rooms/" + encodeURIComponent(roomCode)).then((r) => {
        if (r.ok && r.body && r.body.personal) {
          if (r.body.title) setRoomTitle(r.body.title);
          if (r.body.has_password) setNeedPass(true);
        }
      });

      // Сначала восстанавливаем ключ E2E (ссылка/хранилище), потом коннект —
      // иначе история чата из join_ok расшифруется без ключа.
      (async () => {
        await applySavedE2e();
        // Вошедший по ссылке с живой сессией аккаунта попадает в эфир сразу:
        // имя из профиля, гейт не показывается. Сам join сервер тоже свяжет
        // с аккаунтом по куке в WS-хендшейке и выдаст постоянный id.
        const me = await MeetUp.authMe();
        if (me.ok && me.body && me.body.user) {
          M.profile = me.body.user;   // id и avatar_ver — для своей плитки
          nameRef.current = me.body.user.display_name;
          MeetUp.saveName(nameRef.current);
          setIsAccount(true);
          openSocket();
        } else if (savedName) {
          openSocket();
        } else {
          setPhase("gate");
        }
      })();

      const mq = window.matchMedia("(max-width: 820px)");
      const updMq = () => setIsMobile(mq.matches);
      updMq();
      mq.addEventListener("change", updMq);

      // Устаревшие кадры (участник завис/пропал) — возвращаем заглушку.
      const staleTimer = setInterval(() => {
        const now = Date.now();
        const stale = [];
        hasFrameRef.current.forEach((id) => {
          const at = engine.lastFrameAt.get(id) || 0;
          if (now - at > 5000) stale.push(id);
        });
        if (stale.length)
          setHasFrame(prev => { const n = new Set(prev); stale.forEach(id => n.delete(id)); return n; });
        // Звук демонстрации мог просто кончиться (ведущий закрыл дорожку или
        // на показываемом наступила тишина) — сообщений «звук кончился» в
        // протоколе нет, поэтому смотрим, шли ли пакеты последние две секунды.
        const live = engine.screenAudioLive();
        if (live !== screenAudioInRef.current) setScreenAudioIn(live);
      }, 3000);

      // Индикатор «говорит»: по громкости, с затуханием.
      let prevSpeakingKey = "";
      const speakTimer = setInterval(() => {
        const now = Date.now();
        const ids = [];
        M.speakingUntil.forEach((until, id) => { if (until > now) ids.push(id); });
        ids.sort((a, b) => a - b);
        const key = ids.join(",");
        if (key !== prevSpeakingKey) {
          prevSpeakingKey = key;
          setSpeaking(new Set(ids));
        }
      }, 250);

      // Замер пинга: метка времени туда — эхо обратно (см. case "pong").
      const pingTimer = setInterval(() => {
        if (M.ws && M.ws.readyState === 1)
          M.ws.send(JSON.stringify({ type: "ping", t: Date.now() }));
      }, 4000);

      // Таймер «в эфире».
      const elapsedTimer = setInterval(() => {
        if (!M.joinedAt) return;
        const total = Math.floor((Date.now() - M.joinedAt) / 1000);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const sec = total % 60;
        const pad = (x) => String(x).padStart(2, "0");
        setElapsed(h > 0 ? h + ":" + pad(m) + ":" + pad(sec) : pad(m) + ":" + pad(sec));
      }, 1000);

      // Esc закрывает поповеры; стрелки листают страницы плиток
      // (кроме случаев, когда фокус в поле ввода или открыты настройки).
      const onKey = (e) => {
        if (e.key === "Escape") {
          // Полный экран Esc гасит сам (браузер), поэтому здесь только свой
          // режим — иначе одно нажатие снимало бы оба, и человек оставался бы
          // в обычном виде, хотя хотел выйти только из полноэкранного.
          if (stateRef.current.theater) setTheater(false);
          setSettingsOpen(false); setShareOpen(false); setLightbox(null); setPeerVol(null);
          return;
        }
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (stateRef.current.settingsOpen) return;
        // Ctrl/Alt/Cmd — сочетания браузера, не наши: перехватывать их значило
        // бы ломать людям привычные Ctrl+D и Ctrl+F.
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        // Смотрим на ФИЗИЧЕСКУЮ клавишу (e.code), а не на введённый символ:
        // иначе в русской раскладке «ь» вместо «m» ничего бы не работало.
        const s = stateRef.current;
        if (e.code === "KeyM") { e.preventDefault(); M.keys.toggleMic(true); return; }
        if (e.code === "KeyV") { e.preventDefault(); M.keys.toggleCamera(); return; }
        if (e.code === "KeyD") { e.preventDefault(); M.keys.toggleSound(); return; }
        if (e.code === "KeyF") {
          // Только на чужой демонстрации: свою во весь экран разворачивать
          // нечего, а без демонстрации клавише вообще нечего делать.
          if (s.screenId != null && s.screenId !== s.myId) { e.preventDefault(); M.keys.toggleTheater(); }
          return;
        }
        if (s.stageMode) return;   // в режиме сцены страниц нет
        if (e.key === "ArrowLeft") setPage(p => Math.max(0, p - 1));
        if (e.key === "ArrowRight") setPage(p => Math.min(stateRef.current.pages - 1, p + 1));
      };
      window.addEventListener("keydown", onKey);

      // Подключили/выдернули устройство — обновляем списки в настройках.
      const onDevChange = () => { if (stateRef.current.settingsOpen) refreshDevices(); };
      if (navigator.mediaDevices && navigator.mediaDevices.addEventListener)
        navigator.mediaDevices.addEventListener("devicechange", onDevChange);

      return () => {
        mq.removeEventListener("change", updMq);
        clearInterval(staleTimer);
        clearInterval(speakTimer);
        clearInterval(pingTimer);
        clearInterval(elapsedTimer);
        clearTimeout(M.noticeTimer);
        window.removeEventListener("keydown", onKey);
        if (navigator.mediaDevices && navigator.mediaDevices.removeEventListener)
          navigator.mediaDevices.removeEventListener("devicechange", onDevChange);
        M.manualClose = true;
        try { if (M.ws) M.ws.close(); } catch (e) {}
        stopEverything();
      };
    }, []);

    // Своя плитка: превью пере-присваивается после каждого рендера,
    // потому что <video> размонтируется при листании страниц.
    useEffect(() => {
      const el = selfVideoRef.current;
      const stream = cam ? M.camStream : null;
      if (el && stream && el.srcObject !== stream) {
        el.srcObject = stream;
        const p = el.play();
        if (p && p.catch) p.catch(() => {});
      }
      // Превью собственной демонстрации на сцене.
      const stage = stageSelfRef.current;
      if (stage && M.displayStream && stage.srcObject !== M.displayStream) {
        stage.srcObject = M.displayStream;
        const p = stage.play();
        if (p && p.catch) p.catch(() => {});
      }
      // Своя камера на сцене (когда закрепили себя); поток тот же, что в
      // плёнке — MediaStream спокойно играет в двух <video> сразу.
      const pin = stagePinSelfRef.current;
      if (pin && M.camStream && pin.srcObject !== M.camStream) {
        pin.srcObject = M.camStream;
        const p = pin.play();
        if (p && p.catch) p.catch(() => {});
      }
    });

    // ================= Плитки и страницы =================

    const selfAvatar = M.profile && M.profile.avatar_ver > 0
      ? avatarUrl(M.profile.id, M.profile.avatar_ver) : null;
    const allTiles = [{
      key: "self", id: myId, name: nameRef.current || "Вы", self: true,
      mic, cam, speaking: myId != null && speaking.has(myId), hasFrame: true,
      avatar: selfAvatar,
    }].concat(peers.map(p => ({
      key: "p" + p.id, id: p.id, name: p.name, self: false,
      mic: p.mic, cam: p.cam, speaking: speaking.has(p.id), hasFrame: hasFrame.has(p.id),
      avatar: p.userId && p.avatar ? avatarUrl(p.userId, p.avatar) : null,
    })));

    // Что показываем в сетке (настройки «Интерфейса»). Закреплённого и
    // ведущего демонстрацию не прячем никогда — иначе сцена осталась бы без
    // хозяина, а человек не понял бы, куда делся тот, на кого он смотрит.
    const tiles = allTiles.filter(t => {
      if (t.id != null && (t.id === pinnedId || t.id === screenId)) return true;
      if (t.self) return showSelf;
      if (hideNoVideo && !(t.cam && t.hasFrame)) return false;
      return true;
    });

    // Режим сцены: демонстрация экрана или закреплённый участник —
    // сцена + плёнка камер вместо сетки. Закрепление важнее демонстрации.
    const screenActive = screenId != null;
    const screenSelf = screenActive && myId != null && screenId === myId;
    const sharerName = screenSelf
      ? "Вы"
      : ((peers.find(p => p.id === screenId) || {}).name || "");
    const stageReady = screenSelf || screenFrames.has(screenId);
    const pinnedTile = pinnedId != null ? allTiles.find(t => t.id === pinnedId) : null;
    const pinActive = !!pinnedTile;
    const stageMode = screenActive || pinActive;

    function togglePin(t) {
      if (t.id == null) return;
      setPinnedId(cur => (cur === t.id ? null : t.id));
    }

    // Личная громкость участника. На компьютере — правая кнопка, на телефоне
    // контекстного меню нет вовсе, поэтому долгий тап: жест один и тот же по
    // смыслу, и ручка нужна на обоих одинаково.
    function openPeerVol(t, ev) {
      if (ev) ev.preventDefault();
      if (t.self || t.id == null) return;
      setPeerVol({ id: t.id, name: t.name, vol: Math.round(engine.peerVolume(t.id) * 100) });
    }
    function holdStart(t) {
      holdCancel();
      holdRef.current = setTimeout(() => {
        holdRef.current = null;
        M.holdFired = true;   // чтобы отпускание пальца не закрепило плитку
        openPeerVol(t);
      }, 500);
    }
    function holdCancel() {
      if (holdRef.current) { clearTimeout(holdRef.current); holdRef.current = null; }
    }
    function tileClick(t) {
      if (M.holdFired) { M.holdFired = false; return; }
      togglePin(t);
    }

    // На телефоне кнопки дока меньше: их шесть, и в 360 px они иначе не встают.
    const dockSize = isMobile ? "sm" : "md";
    const perPage = perPagePref === "auto" ? (isMobile ? 6 : 9) : Number(perPagePref);
    const pages = stageMode ? 1 : Math.max(1, Math.ceil(tiles.length / perPage));
    const curPage = Math.min(page, pages - 1);
    const visible = tiles.slice(curPage * perPage, curPage * perPage + perPage);

    // Актуальный снимок состояния для обработчиков вне рендера
    // (WS-сообщения, таймеры, аудио-callback).
    useEffect(() => {
      stateRef.current = { phase, mic, cam, sharing, screenId, myId, stageMode, tab, panelOpen,
                           isMobile, pages, settingsOpen, theater };
      // Слушатель клавиш навешан один раз и держал бы первые версии этих
